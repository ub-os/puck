<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="name" value="m-indexedsearch"/>

<li class="{name}__result"
	 data-link-area
	 hx-boost:inherited="false">
    <h3 class="{name}__result__header">
        <span class="{row.CSSsuffix}">{row.title -> f:format.raw()}</span>
    </h3>
    <p class="{name}__result__description">{row.description -> f:format.raw()}</p>
    <a href="{row.pathUri}" class="{name}__result__link">
        <f:if condition="{row.pathUri} == '/'">
            <f:then>
                <f:uri.typolink parameter="{f:cObject(typoscriptObjectPath: 'lib.rootpid')}" absolute="1"/>
            </f:then>
            <f:else>
                <f:uri.typolink parameter="{row.pathUri}" absolute="1"/>
            </f:else>
        </f:if>
    </a>
    <f:if condition="{row.subresults}">
        <ul class="{name}__list -sub">
            <f:for each="{row.subresults.items}" as="subrow">
                <f:render partial="Searchresult" arguments="{row: subrow}"/>
            </f:for>
        </ul>
    </f:if>
</li>
</html>
