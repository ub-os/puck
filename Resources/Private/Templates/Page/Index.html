<page-root
        id="root"
        class="-layout-{record.backend_layout}"
		hx-boost:inherited="true"
		hx-swap:inherited="outerHTML transition:true"
		hx-indicator:inherited="#root-loading-bar"
		hx-preload:inherited="mousedown"
		logger="{f:if(condition:'{context.backendUser}',then:'enabled')}">
	<div data-controller="anchor-handler" id="root-controllers"></div>
	<!--TYPO3SEARCH_end-->
    <f:if condition="{record.backend_layout} !== 'pagets__error'">
        <module:schema record="{record}" context="{context}"/>
        <module:header record="{record}" context="{context}"/>
    </f:if>
    <!--TYPO3SEARCH_begin-->
    <module:main record="{record}">
		<f:render.contentArea contentArea="{content.main}" />
	</module:main>
	<div id="modal-container">
		<f:render.contentArea contentArea="{content.modals}" />
	</div>
    <!--TYPO3SEARCH_end-->
    <f:if condition="{record.backend_layout} !== 'pagets__error'">
        <module:footer record="{record}">

		</module:footer>
    </f:if>
    <module:main.toTop/>
	<div id="root-loading-bar"></div>
</page-root>
