
<f:argument name="name" type="string" optional="1" default="l-row__item"/>
<f:argument name="width" type="string" optional="1"/>
<f:argument name="breakpoints" type="array" optional="1" default="{bp:'auto'}"/>
<f:argument name="attributes" type="array" optional="1"/>


<u:var set="bpClasses"><f:for each="{breakpoints}" key="bp" as="val">-{bp}-{val} </f:for></u:var>

<tag:div class="{class} {name} -width-{width} {bpClasses}" additionalAttributes="{attributes}">
	<f:slot/>
</tag:div>
