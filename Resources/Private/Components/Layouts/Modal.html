
<f:argument name="name" type="string" optional="1" default="l-modal"/>
<f:argument name="id" type="string" optional="1"/>
<f:argument name="width" type="integer" optional="1" default="6"/>
<f:argument name="modalAttributes" type="array" optional="1" default="{}"/>
<f:argument name="attributes" type="array" optional="1"/>

<tag:dialog
	class="{class} {name} -width-{width}"
	data-controller="modal"
	data-modal="{u:array(input:{duration:170}, merge:modalAttributes) -> f:format.json()}"
	additionalAttributes="{attributes}"
	id="{id}">

	<button class="{name}__close"
			type="button"
			data-autofocus
			data-action="modal.hide"
			aria-label="{f:translate(key:'close')}">
		<icon:char icon="xmark-regular"/>
	</button>
	<f:slot/>
</tag:dialog>
