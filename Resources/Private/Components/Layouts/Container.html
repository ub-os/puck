
<f:argument name="name" type="string" optional="1" default="l-container"/>
<f:argument name="width" type="integer" optional="1" />
<f:argument name="offset" type="integer" optional="1" />
<f:argument name="align" type="string" optional="1" />
<f:argument name="attributes" type="mixed" optional="1"/>


<tag:div class="{class} {name} -offset-{offset}"
		 classModifiers="{-width: width, -align: align}"
		 additionalAttributes="{attributes}">
	<div class="{name}__inner">
		<f:slot/>
	</div>
</tag:div>
