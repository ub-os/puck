
<f:argument name="name" type="string" optional="1" default="e-navigation"/>
<f:argument name="identifier" type="string" optional="1"/>
<f:argument name="pages" type="string" optional="1" default="1"/>
<f:argument name="processor" type="string" optional="1" default="tree"/>
<f:argument name="depth" type="integer" optional="1" default="1"/>
<f:argument name="menu" type="array" optional="1"/>
<f:argument name="prependIcon" type="boolean" optional="1" default="0"/>
<f:argument name="hideTitle" type="boolean" optional="1" default="0"/>
<f:argument name="label" type="string" optional="1" default=""/>
<f:argument name="attributes" type="array" optional="1"/>


<f:if condition="{identifier}">
	<f:then>
		<f:render section="FromSysNavigation" arguments="{_all}"/>
	</f:then>
	<f:else>
		<f:render section="FromArguments" arguments="{_all}"/>
	</f:else>
</f:if>

<f:section name="FromSysNavigation">
	<f:variable name="nav"
				value="{u:sysNavigationData(identifier:identifier, depth:depth)}"/>

	<nav class="{u:prependClass()}{name}" aria-label="{nav.label}">
		<ul class="{name}__list {f:if(condition: iconFromTitle, then: '-icons')}" {attributes ->
			u:renderAttributes()}>
			<element:navigation.items
				name="{name}"
				menu="{nav.menu}"
				processor="{nav.mode}"
				depth="{depth}"
				prependIcon="{prependIcon}"
				hideTitle="{hideTitle}"
			/>
			<f:slot/>
		</ul>
	</nav>
</f:section>

<f:section name="FromArguments">
	<f:if condition="!{menu}">
		<f:variable name="menu"
					value="{u:menu(pages:pages, processor:processor, depth:depth)}"/>
	</f:if>

	<nav class="{u:prependClass()}{name}" aria-label="{label}">
		<ul class="{name}__list {f:if(condition: iconFromTitle, then: '-icons')}" {attributes -> u:renderAttributes()}>
			<element:navigation.items
				name="{name}"
				menu="{menu}"
				processor="{processor}"
				depth="{depth}"
				prependIcon="{prependIcon}"
				hideTitle="{hideTitle}"
			/>
			<f:slot/>
		</ul>
	</nav>
</f:section>
