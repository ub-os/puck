
<f:argument name="name" type="string" optional="1" default="m-sectionCarousel"/>
<f:argument name="record" type="mixed"/>
<f:argument name="children_300" type="array" optional="1"/>

<f:variable name="optionsArray" value="{record.options -> u:mergedFlexFormSheets()}"/>
<layout:carousel class="{name}"
				 align="stretch"
				 carouselAttributes="{optionsArray.carousel}"
				 id="c{record.uid}">
	<f:for each="{children_300}" as="child">
		<div class="{name}__slide splide__slide">
			{child.renderedContent -> f:format.raw()}
		</div>
	</f:for>
</layout:carousel>
