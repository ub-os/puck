
<f:argument name="name" type="string" optional="1" default="m-footer"/>
<f:argument name="record" type="mixed"/>


<footer id="footer" class="{name}">
	<layout:section class="{name}__nav__wrap" id="footer-section">
		<element:navigation name="{name}__nav" identifier="footer">
			<f:if condition="{site.settings.puck.enableCookieSettings}">
				<li class="{name}__nav__item">
					<button type="button" class="{name}__nav__link" data-uc-show-second-layer>
						<f:translate key="cookie-settings" extensionName="puck"/>
					</button>
				</li>
			</f:if>
		</element:navigation>
		<element:navigation name="{name}__nav" identifier="social"
							class="-icons" prependIcon="1" hideTitle="1"/>
	</layout:section>
	<f:slot/>
</footer>
