<f:comment><f:debug title="{settings.contentElement} (object)">{object}</f:debug>
<f:for each="{object.computedProps}" as="prop">
  <f:debug title="{settings.contentElement} (object.{prop})">{object.{prop}}</f:debug>
</f:for></f:comment>
<f:switch expression="{object.layout}">
  <f:defaultCase>
    <module:menu.list object="{object}"
                      itemConfig="{body:0,cta:0,category:0}"/>
  </f:defaultCase>
</f:switch>
