<div class="{data.name} {data.class}" >
    <ul class="{data.name}__list {f:if(condition: data.iconFromTitle, then: '-icons')}" {data.attributes}>
        <f:for each="{menu}" as="item" iteration="i">
            <li class="{data.name}__item {item.class}">
                <f:if condition="{i.index} > 0 && {data.special} == 'rootline'">❯</f:if>
                <f:if condition="{i.isLast} && {data.special} == 'rootline'">
                    <f:then>
                      <span class="{data.name}__link">
                        <f:format.raw>{item.data.title}</f:format.raw>
                      </span>
                    </f:then>
                    <f:else>
                        <f:variable name="mods"
                                    value="{
                                        active: item.active,
                                        current: item.current,
                                        has-subpages: item.hasSubpages}"/>
                        <f:link.typolink parameter="{item.data.uid}"
                                         class="{data.name}__link {item.class} {mods -> ub:modClass()}"
                                         absolute="1"
                                         additionalAttributes="{aria-label: item.data.title}">
                            <f:if condition="{i.index} == 0 && {data.special} == 'rootline'">
                                <icon:svg icon="home" class="{data.name}__icon"/>
                            </f:if>
                            <f:if condition="{data.iconFromTitle}">
                                <f:then>
                                    <icon:svg icon="{item.data.title}" class="{data.name}__icon"/>
                                </f:then>
                                <f:else>
                                    <f:format.raw>{item.data.title}</f:format.raw>
                                </f:else>
                            </f:if>
                        </f:link.typolink>
                    </f:else>
                </f:if>
                <f:if condition="{item.children}">
                    <f:variable name="subName">{data.name}__sub</f:variable>
                    <ul class="{subName}__list">
                        <f:for each="{item.children}" as="item">
                            <f:variable name="mods"
                                        value="{
                                        active: item.active,
                                        current: item.current,
                                        has-subpages: item.hasSubpages}"/>
                            <li class="{subName}__item {mods -> ub:modClass()}">
                                <f:link.typolink
                                        parameter="{item.link}"
                                        absolute="1"
                                        class="{subName}__link {item.class}">
                                    <f:format.raw>{item.data.title}</f:format.raw>
                                </f:link.typolink>
                        </f:for>
                    </ul>
                </f:if>
            </li>
        </f:for>
        <f:format.raw>
            {data.content}
        </f:format.raw>
        <f:if condition="{data.languageMenu}">
            <li class="{data.name}__item">
            </li>
        </f:if>
    </ul>
    <f:if condition="{data.breadcrumbs}">
        <schema:type.breadcrumbList>
            <f:for each="{menu}" as="item" iteration="i">
                <schema:type.listItem
                        -as="itemListElement"
                        position="{i.cycle}"
                        name="{item.title}"
                        item="{f:uri.page(pageUid: '{item.data.uid}', absolute: '1')}"
                />
            </f:for>
        </schema:type.breadcrumbList>
    </f:if>
</div>
