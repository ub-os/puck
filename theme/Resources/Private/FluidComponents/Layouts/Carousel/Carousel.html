
<fc:component>
  <fc:param name="name" type="string" optional="1" default="l-carousel"/>
  <fc:param name="id" type="string"/>
  <fc:param name="options" type="array" optional="1"/>
  <fc:param name="controls" type="boolean" optional="1" default="1"/>
  <fc:param name="pagination" type="boolean" optional="1" default="0"/>
  <fc:param name="slideCount" type="integer" optional="1" default="0"/>
  <fc:param name="trackOverflow" type="string" optional="1" default="hidden"/>
  <fc:renderer>

    <div class="{name} {class} splide" data-carousel="{options}" id="{id}">
      <div class="{name}__track splide__track -overflow-{trackOverflow}">
        <ul class="{name}__list splide__list">
          <f:format.raw>{content}</f:format.raw>
        </ul>
      </div>

      <f:if condition="{controls}">
        <div class="{name}__controls {class} splide__arrows">
          <button class="{name}__controls__prev splide__arrow--prev" aria-controls="{id}">
            <icon:svg icon="arrow-left-regular"/>
          </button>
          <button class="{name}__controls__next splide__arrow--next" aria-controls="{id}">
            <icon:svg icon="arrow-right-regular"/>
          </button>
        </div>
      </f:if>

      <f:if condition="{pagination} && {slideCount}">
        <div class="{name}__pagination {class}">
          <f:for each="{ub:array.range(end: '{slideCount}-1')}" as="index">
            <button class="{name}__pagination__item" aria-controls="{id}" data-go-to="{index}">
            </button>
          </f:for>
        </div>
      </f:if>
    </div>

  </fc:renderer>
</fc:component>
