
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-carousel"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="cropVariant" type="string" optional="1" default="default"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap"
            object="{object}"
            id="c{object.uid}">
      <element:text.header data="{object}"/>
      <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>
      <layout:carousel id="c{object.uid}-splide">
        <f:for each="{object.inlineMedia}" as="item" iteration="i">
          <layout:row.item
                  class="splide__slide {name}__item"
                  width="{object.columnWidths.{i.index}}">
            <layout:card
                    media="{item.assets}"
                    cropVariant="{cropVariant}"
                    width="{object.columnWidths.{i.index}}"
                    mediaSize="{item.cardMediaSize}"
                    orient="{item.imageorient}">
              <f:if condition="{item.header}">
                <h3 class="{name}__headline"><f:format.raw>{item.header}</f:format.raw></h3>
              </f:if>
              <f:if condition="{item.bodytext}">
                <element:text.rich text="{item.bodytext}"/>
              </f:if>
            </layout:card>
          </layout:row.item>
        </f:for>
      </layout:carousel>
    </layout:section>

  </fc:renderer>
</fc:component>
