
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-cards"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="cropVariant" type="string" optional="1" default="default"/>
  <fc:renderer>

    <layout:section
        class="{name}__wrap"
        object="{object}"
        id="c{object.uid}">
      <element:text.header object="{object}"/>
      <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>

      <f:switch expression="{object.layout}">

        <f:case value="carousel">
          <layout:carousel id="c{object.uid}-splide" class="{name}__carousel">
            <f:for each="{object.inlineMedia}" as="item" iteration="i">
              <layout:row.item
                      class="splide__slide {name}__item -stretch-content"
                      width="{object.columnWidths.{i.index}}">
                <module:content.cards.item item="{item}"/>
              </layout:row.item>
            </f:for>
          </layout:carousel>
        </f:case>

        <f:defaultCase>
          <layout:row justify="{object.columnPosition}" flexGrow="0" class="{name}__row">
            <f:for each="{object.inlineMedia}" as="item" iteration="i">
              <layout:row.item width="{object.columnWidths.{i.index}}" class="-stretch-content">
                <module:content.cards.item item="{item}"/>
              </layout:row.item>
            </f:for>
          </layout:row>
        </f:defaultCase>

      </f:switch>

    </layout:section>

  </fc:renderer>
</fc:component>
