
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-text"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap {f:if(condition: '!{object.bodytext}', then: '-headline-only')} {class}"
            object="{object}"
            id="c{object.uid}">
        <element:text.header data="{object}"/>
        <element:text.rich text="{object.bodytext}"/>
        <f:format.html>{content}</f:format.html>
    </layout:section>

  </fc:renderer>
</fc:component>
