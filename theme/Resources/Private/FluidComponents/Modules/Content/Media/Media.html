
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-media"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="cropVariant" type="string" optional="1" default="default"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap"
            object="{object}"
            id="c{object.uid}">
      <element:text.header object="{object}"/>
      <layout:media
              media="{object.assets}"
              text="{object.bodytext}"
              orient="{object.imageorient}"
              justify="{object.columnPosition}"
              mediaWidth="{object.mediaColumnWidth}"
              textWidth="{object.textColumnWidth}"
              itemWidth="{object.itemColumnWidth}"
              mediaMobileMaxVh="{object.mediaMaxHeight}"
              cropVariant="{cropVariant}"/>
    </layout:section>

  </fc:renderer>
</fc:component>
