
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-columns"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:section
        class="{name}__wrap"
        object="{object}"
        id="c{object.uid}">
      <element:text.header object="{object}"/>
      <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>
      <layout:row justify="{object.columnPosition}">
        <f:for each="{object.inlineMedia}" as="item" iteration="i">
          <layout:row.item width="{object.columnWidths.{i.index}}">
            <div class="{name}__column">
              <f:if condition="{item.header}">
                <h3 class="{name}__headline"><f:format.raw>{item.header}</f:format.raw></h3>
              </f:if>
              <layout:media
                      media="{item.assets}"
                      text="{item.bodytext}"
                      orient="{item.imageorient}"
                      justify="{item.columnPosition}"
                      mediaWidth="{item.mediaColumnWidth}"
                      textWidth="{item.textColumnWidth}"
                      itemWidth="{item.itemColumnWidth}"
                      mediaMobileMaxVh="{item.mediaMaxHeight}"/>
            </div>
          </layout:row.item>
        </f:for>
      </layout:row>
    </layout:section>

  </fc:renderer>
</fc:component>
