
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-accordions"/>
  <fc:param name="item" type="mixed"/>
  <fc:param name="uid" type="integer"/>
  <fc:param name="i" type="array"/>
  <fc:renderer>

    <f:variable name="options" value="{groupId: 'c{uid}'}"/>
    <f:variable name="id" value="c{uid}-{i.index}-accordion"/>
    <li class="{name}__item" id="{id}">
      <button class="{name}__button"
              id="{id}-header"
              aria-controls="{id}-collapse">
        <span class="{name}__title"><f:format.raw>{item.header}</f:format.raw></span>
        <span class="{name}__icon"></span>
      </button>
      <div class="{name}__collapse"
           id="{id}-collapse"
           aria-labelledby="{id}-header"
           data-accordion="{options -> f:format.json()}">
        <div class="{name}__content">
          <layout:media
                  media="{item.assets}"
                  text="{item.bodytext}"
                  orient="{item.imageorient}"
                  justify="{item.columnPosition}"
                  mediaWidth="{item.mediaColumnWidth}"
                  textWidth="{item.textColumnWidth}"
                  mediaMobileMaxVh="{object.mediaMaxHeight}"
                  itemWidth="{item.itemColumnWidth}"/>
        </div>
      </div>
    </li>

  </fc:renderer>
</fc:component>
