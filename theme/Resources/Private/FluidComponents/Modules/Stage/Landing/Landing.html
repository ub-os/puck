
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-stage-landing"/>
  <fc:param name="data" type="array"/>
  <fc:param name="files" type="array" optional="1"/>
    <fc:param name="files2" type="array" optional="1"/>
    <fc:renderer>

    <layout:section
        class="{name}__wrap"
        container="0"
        id="c{data.uid}"
        top="none"
        bottom="medium">
        <div class="{name}">
            <div class="{name}__text">
                <div class="{name}__container">
                    <icon:svg icon="logo" class="{name}__logo"/>
                    <h1 class="{name}__headline">{data.header}</h1>
                    <element:text.rich text="{data.bodytext}"/>
                </div>
            </div>
            <element:media
                    file="{files.0}"
                    cropVariant="default"
                    name="{name}"
                    width="960"
                    controls="0"
                    autoplay="1"
                    loop="1"
                    webp="1"
                    retina="1"
                    sources="{
                    s: {width: 960, cropVariant: 'default'},
                    0: {width: 600, cropVariant: 'default'}
                }"/>
        </div>
    </layout:section>

  </fc:renderer>
</fc:component>
