
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-stage-default"/>
  <fc:param name="object" type="mixed"/>
    <fc:renderer>

    <layout:section
        container="cols10"
        class="{name}__wrap {f:if(condition: '!{object.bodytext} && !{object.assets}', then: '-headline-only')} -{object.layout}"
        top="none"
        bottom="none"
        id="c{object.uid}">
        <div class="{name}__text">
            <h1 class="{name}__headline">{object.header}</h1>
            <f:if condition="{object.bodytext}">
                <div class="{name}__bodytext e-text-rich">
                    <f:format.raw>{object.bodytext}</f:format.raw>
                </div>
            </f:if>
        </div>
        <f:if condition="{object.assets}">
            <element:media
                    file="{object.assets.0}"
                    cropVariant="3:2"
                    name="{name}"
                    width="900"
                    loading="lazy"
                    showDesc="1"
                    sources="{
                        s: {width: 900, cropVariant: '3:2'},
                        0: {width: 600, cropVariant: '3:2'}
                    }"/>
        </f:if>

    </layout:section>
  </fc:renderer>
</fc:component>
