
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-media-gallery"/>
  <fc:param name="data" type="array"/>
  <fc:param name="files" type="array"/>
  <fc:param name="cropVariant" type="string" optional="1" default="default"/>
  <fc:renderer>

    <layout:section
        class="{name}__wrap {class}"
        appearance="{data.frame_class}"
        data="{data}"
        id="c{data.uid}"
        container="cols10">
      <element:text.header data="{data}"/>
      <module:text.media.item data="{imageorient: 6, imagecols: data.imagecols, layout: data.layout}" cropVariant="{cropVariant}" files="{files}" />
    </layout:section>

  </fc:renderer>
</fc:component>
