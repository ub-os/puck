
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-menu-list-item"/>
  <fc:param name="link" type="Link"/>
  <fc:param name="headline" type="string"/>
  <fc:param name="topline" type="string" optional="1"/>
  <fc:param name="date" type="DateTime" optional="1"/>
  <fc:param name="categories" type="array" optional="1"/>
  <fc:param name="body" type="string" optional="1"/>
  <fc:param name="images" type="array" optional="1"/>
  <fc:param name="attributes" type="array" optional="1"/>
  <fc:param name="config" type="array" optional="1" default="{}"/>
  <fc:param name="configDefault"
            type="array"
            optional="1"
            default="{type: 'item', class: '', image: 1, body: 1, category: 1, cta: 1, cropVariant: '2:1'}"/>

  <fc:renderer>
    <f:variable name="config" value="{ubos:arr.merge(a:configDefault,b:config)}"/>

    <li class="{name} {class}">
      <article class="{name}__article" data-link-to="{link -> f:format.raw()}">
        <f:if condition="{config.image}">
          <element:media
                  name="{name}"
                  file="{images.0}"
                  cropVariant="{config.cropVariant}"
                  width="720"
                  sources="{
          s: {width: 720, cropVariant: config.cropVariant},
          0: {width: 600, cropVariant: config.cropVariant}
          }"/>
        </f:if>
        <div class="{name}__text">
          <f:if condition="{topline} || {date} || {categories}">
            <div class="{name}__topline">
              <f:if condition="{date}">
                <time class="{name}__date" datetime="{date -> f:format.date(format: 'Y-m-d H:i:s')}">{date -> f:format.date(format: 'd.m.Y')}</time>
              </f:if>
              {topline}
              <f:if condition="{config.category} && {categories}">
                <span class="{name}__categories">
                  <f:for each="{categories}" as="cat" iteration="i">
                    <span class="{name}__category">{cat.title}</span>{f:if(condition: '!{i.isLast}', then:' |')}
                  </f:for>
                </span>
              </f:if>
            </div>
          </f:if>
          <a href="{link -> f:format.raw()}"
             class="{name}__headline"
             data-link-to-stop="1">
              {headline}
          </a>
          <f:if condition="{config.body}">
            <div class="{name}__body"><f:format.raw>{body}</f:format.raw></div>
          </f:if>
          <f:if condition="{config.cta}">
            <button class="{name}__cta e-button-primary">
              <f:translate extensionName="theme" key="learn-more"/>
            </button>
          </f:if>
        </div>
      </article>
    </li>
  </fc:renderer>
</fc:component>
