
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-page-header"/>
  <fc:param name="data" type="array"/>
  <fc:renderer>

    <f:variable name="scrollSensitive"
                value="{
                  items: {
                    0: {top: 1, media: 0},
                    1: {top: 33, media: 600}
                  }
                }" />
    <header class="{name}" data-burger-el="parent"
            data-scroll-sensitive='{scrollSensitive -> f:format.json() -> f:format.htmlentitiesDecode()}'>
      <div class="{name}__background"></div>
      <div class="{name}__container">
        <f:link.typolink
                class="{name}__homelink"
                absolute="1"
                parameter="{f:cObject(typoscriptObjectPath: 'lib.rootpid')}">
          <img src="/typo3conf/ext/theme/Resources/Public/images/icons/website-logo.svg" alt="Algovir" class="{name}__logo">
        </f:link.typolink>
        <div class="{name}-navigation__wrap" data-burger-el="navigation">
          <element:navigation name="{name}-navigation" class="-small" pageUid="{settings.navUid.meta}">
            <f:if condition="{data.uid} != 18">
              <li class="{name}-navigation__item">
                <a href="#" class="{name}-navigation__link" data-modal-trigger="header-search-modal">
                  <f:translate extensionName="theme" key="search"/>
                </a>
              </li>
            </f:if>
          </element:navigation>
          <element:navigation name="{name}-navigation" class="" pageUid="{settings.navUid.main}"/>
        </div>
        <div class="{name}__burger">
          <element:control.burger/>
        </div>
      </div>
    </header>
    <f:variable name="searchName" value="m-form-indexedsearch"/>
    <layout:modal id="header-search-modal"
                  class="{searchName}__modal"
                  container="cols12">
      <form>
        <div class="{searchName}__input__wrap">
          <input type="text"
                 class="{searchName}__input"
                 data-search-el="input">
        </div>
        <div class="{searchName}__submit__wrap">
          <button type="submit"
                 class="{searchName}__submit -disabled"
                 data-search-el="submit"/>
        </div>
      </form>
    </layout:modal>

  </fc:renderer>
</fc:component>
