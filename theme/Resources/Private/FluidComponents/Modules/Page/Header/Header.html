
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-page-header"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <f:variable name="scrollSensitive"
                value="{
                  top: {
                    0: {top: 1, media: 0},
                    1: {top: 25, media: 600}
                  }
                }" />
    <header class="{name}"
            data-scroll-sensitive='{scrollSensitive -> f:format.json()}'>
      <div class="{name}__background"></div>
      <div class="{name}__container">
        <f:link.typolink
                class="{name}__anchor"
                absolute="1"
                parameter="{f:cObject(typoscriptObjectPath: 'lib.rootpid')}">
          <img src="/typo3conf/ext/theme/Resources/Public/Icons/website-logo.svg" class="{name}__logo">
        </f:link.typolink>
        <div class="{name}-menu__wrap" data-burger-menu id="main-menu">
          <f:comment>
              // small navigation with search link that opens modal
            <element:navigation name="{name}-menu" class="-small" pageUid="{settings.navUid.meta}">
              <f:if condition="{data.uid} != 18">
                <li class="{name}-menu__item">
                  <a href="#" class="{name}-menu__link" aria-controls="header-search-modal">
                    <f:translate extensionName="theme" key="search"/>
                  </a>
                </li>
              </f:if>
            </element:navigation>
          </f:comment>

          <element:navigation name="{name}-menu" class="" pageUid="{settings.navUid.main}"/>
        </div>
        <div class="{name}-menu__backdrop"></div>
        <div class="{name}__burger">
          <element:control.burger/>
        </div>
      </div>
    </header>
    <f:variable name="searchName" value="m-form-indexedsearch"/>
    <layout:modal id="header-search-modal"
                  class="{searchName}__modal"
                  container="cols12">
      <form>
        <div class="{searchName}__input__wrap">
          <input type="text"
                 class="{searchName}__input"
                 data-search-el="input">
        </div>
        <div class="{searchName}__submit__wrap">
          <button type="submit"
                 class="{searchName}__submit -disabled"
                 data-search-el="submit"/>
        </div>
      </form>
    </layout:modal>

  </fc:renderer>
</fc:component>
