
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-page-footer"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="contentElements" type="string"/>
  <fc:renderer>

    <footer class="{name}">
      <layout:section
              class="{name}-navigation__wrap"
              top="none">
        <div class="{name}__navigations">
          <element:navigation name="{name}-navigation" pageUid="{settings.navUid.footer}" class="">
            <li class="{name}-navigation__item">
              <button class="{name}-navigation__link" onclick="UC_UI.showSecondLayer();">Cookies</button>
            </li>
          </element:navigation>
          <element:navigation name="{name}-navigation" pageUid="{settings.navUid.social}" class="-social"  iconFromTitle="1"/>
        </div>
      </layout:section>
      <f:format.raw>{contentElements}</f:format.raw>
    </footer>

  </fc:renderer>
</fc:component>
