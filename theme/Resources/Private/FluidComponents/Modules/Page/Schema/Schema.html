<fc:component>
  <fc:param name="data" type="array"/>
  <fc:param name="files" type="array" optional="1"/>
  <fc:param name="name" type="string" optional="1" default="m-page-schema"/>
  <fc:renderer>

    <f:variable name="primaryImage"><f:if condition="{files.0}"><f:then><f:uri.image image="{files.0}" crop="{files.0.crop}" width="1920" cropVariant="16:9" absolute="1"></f:uri.image></f:then><f:else>{f:uri.resource(path: 'EXT:theme/Resources/Public/images/icons/logo.svg',absolute: 'true')}</f:else></f:if></f:variable>
    <f:variable name="searchTermString">{<f:format.raw>search_term_string</f:format.raw>}</f:variable>
    <schema:type.webPage
        -id="{f:uri.page(absolute: 'true')}#webpage"
        url="{f:uri.page(absolute: 'true')}"
        inLanguage="de-DE"
        name="{data.seo_title}"
        datePublished="{data.starttime}"
        dateModified="{data.lastUpdated}">
      <schema:type.webSite
        -as="isPartOf"
        -id="{f:uri.page(pageUid: lib.rootpid, absolute: 'true')}#website"
        url="{f:uri.page(pageUid: lib.rootpid ,absolute: 'true')}"
        name="Biolectra® Magnesium">
        <schema:type.searchAction
            -as="potentialAction"
            query-input="required name=search_term_string"
            target="{f:uri.page(pageUid: '14',absolute: 'true')}s/{searchTermString}">
        </schema:type.searchAction>
      </schema:type.webSite>
      <schema:type.imageObject
          -as="primaryImageOfPage"
          -id="{f:uri.page(absolute: 'true')}#primaryimage"
          url="{primaryImage}"
          width="1920"
          height="1080"/>
    </schema:type.webPage>

  </fc:renderer>
</fc:component>
