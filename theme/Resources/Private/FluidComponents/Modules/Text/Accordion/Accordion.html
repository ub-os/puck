
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-text-accordion"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:section
        class="{name}__wrap"
        data="{object}"
        container="cols8"
        appearance="{object.frameClass}"
        id="c{object.uid}"
        dataAttributes='data-acc-el=group'>
      <element:text.header data="{object}"/>
      <element:text.rich text="{object.bodytext}"/>
      <ul class="{name}__list">
        <f:for each="{object.inlineMedia}" as="item" iteration="i">
          <module:text.accordion.item
              name="{name}"
              item="{item}"
              uid="{object.uid}"
              i="{i}"/>
        </f:for>
      </ul>
    </layout:section>

  </fc:renderer>
</fc:component>
