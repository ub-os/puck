
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-text-accordions"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:section
        class="{name}__wrap"
        object="{object}"
        container="cols10"
        id="c{object.uid}">
      <element:text.header data="{object}"/>
      <element:text.rich text="{object.bodytext}"/>
      <ul class="{name}">
        <f:for each="{object.inlineMedia}" as="item" iteration="i">
          <module:text.accordions.item
              name="{name}"
              item="{item}"
              uid="{object.uid}"
              i="{i}"/>
        </f:for>
      </ul>
    </layout:section>

  </fc:renderer>
</fc:component>
