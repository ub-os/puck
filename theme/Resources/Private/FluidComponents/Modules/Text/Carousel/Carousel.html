
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-text-carousel"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap"
            object="{object}"
            container="cols10"
            id="c{object.uid}">
      <element:text.header data="{object}"/>
      <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>
      <div class="splide" data-carousel id="c{object.uid}-splide">
        <div class="splide__track -col{object.imagecols}">
          <ul class="splide__list">
            <f:for each="{object.inlineMedia}" as="item" iteration="i">
              <li class="splide__slide">
                <f:if condition="{item.header}">
                  <h3 class="{name}__headline"><f:format.raw>{item.header}</f:format.raw></h3>
                </f:if>
                <module:text.media.item object="{item}"/>
              </li>
            </f:for>
          </ul>
        </div>
      </div>
      <button class="{name}__control__prev" aria-controls="c{object.uid}-splide" data-go-to="<">Prev</button>
      <button class="{name}__control__next" aria-controls="c{object.uid}-splide" data-go-to=">">Next</button>
    </layout:section>

  </fc:renderer>
</fc:component>
