
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-text-columns"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:section
        class="{name}__wrap"
        data="{object}"
        container="cols10"
        appearance="{object.frameClass}"
        id="c{object.uid}">
      <element:text.header data="{object}"/>
      <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>
      <ul class="{name}__list -col{object.imagecols}">
        <f:for each="{object.inlineMedia}" as="item" iteration="i">
          <module:text.columns.item
              name="{name}"
              item="{item}"
              class="-{object.frameClass2}"
              uid="{object.uid}"
              i="{i}"/>
        </f:for>
      </ul>
    </layout:section>

  </fc:renderer>
</fc:component>
