
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-text-media"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="cropVariant" type="string" optional="1" default="default"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap"
            container="cols10"
            object="{object}"
            id="c{object.uid}">
      <element:text.header data="{object}"/>
      <module:text.media.item object="{object}" name="{name}" cropVariant="{cropVariant}"/>
    </layout:section>

  </fc:renderer>
</fc:component>
