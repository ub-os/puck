
<fc:component>
    <fc:param name="name" type="string" optional="1" default="m-text-media"/>
    <fc:param name="object" type="mixed"/>
    <fc:param name="cropVariant" type="string" optional="1" default="default"/>
    <fc:renderer>

        <div class="{name} -pos{object.imageorient}">
            <div class="{name}__row -pos{object.imageorient}">
                <f:if condition="{object.assets}">
                    <div class="{name}__media -pos{object.imageorient} -layout-{object.layout}">
                        <f:if condition="{object.imageorient} > 4">
                            <f:then>
                                <f:switch expression="{object.imagecols}">
                                    <f:case value="12">
                                        <f:variable name="calcWidth" value="1300"/>
                                    </f:case>
                                    <f:case value="11">
                                        <f:variable name="calcWidth" value="1080"/>
                                    </f:case>
                                    <f:case value="1">
                                        <f:variable name="calcWidth" value="860"/>
                                    </f:case>
                                    <f:defaultCase>
                                        <f:variable name="calcWidth" value="528"/>
                                    </f:defaultCase>
                                </f:switch>
                            </f:then>
                            <f:else>
                                <f:variable name="calcWidth" value="528"/>
                            </f:else>
                        </f:if>
                        <div class="{name}__gallery -pos{object.imageorient} -col{object.imagecols}">
                            <element:media
                                    name="{name}"
                                    files="{object.assets}"
                                    cropVariant="{cropVariant}"
                                    width="{calcWidth}"
                                    sources="{
                                      s: {width: calcWidth, cropVariant: cropVariant},
                                      0: {width: 528, cropVariant: cropVariant}
                                      }"
                                    showTitle="1"
                                    showDesc="1"/>
                        </div>
                    </div>
                </f:if>
                <f:if condition="{object.bodytext}">
                    <div class="{name}__text -pos{object.imageorient} -layout-{object.layout}">
                        <element:text.rich text="{object.bodytext}"/>
                    </div>
                </f:if>
            </div>
        </div>

    </fc:renderer>
</fc:component>
