
<fc:component>
    <fc:param name="name" type="string" optional="1" default="m-text-media"/>
    <fc:param name="object" type="mixed"/>
    <fc:param name="cropVariant" type="string" optional="1" default="default"/>
    <fc:param name="gridWidth" type="float" optional="1" default="1300"/>
    <fc:renderer>

        <div class="{name} -orient-{object.imageorient}">
            <layout:row class="{name}__row" justify="{object.columnPosition}">
                <f:if condition="{object.assets}">
                    <layout:row.item class="{name}__media" width="{object.mediaColumnWidth}">
                        <f:if condition="{object.itemColumnWidth} > 6">
                            <f:then>
                                <f:variable name="calcWidth" value="{gridWidth}"/>
                            </f:then>
                            <f:else>
                                <f:variable name="calcWidth" value="{ubos:math.evaluate(expression:'{gridWidth}/2')}"/>
                            </f:else>
                        </f:if>
                        <layout:row itemWidth="{object.itemColumnWidth}" justify="{object.columnPosition}">
                            <f:for each="{object.assets}" as="asset">
                                <layout:row.item>
                                    <element:media
                                            name="{name}"
                                            file="{asset}"
                                            cropVariant="{cropVariant}"
                                            width="{calcWidth}"
                                            sources="{
                                      s: {width: calcWidth, cropVariant: cropVariant},
                                      0: {width: 528, cropVariant: cropVariant}
                                      }"
                                            showTitle="1"
                                            showDesc="1"/>
                                </layout:row.item>
                            </f:for>
                        </layout:row>
                    </layout:row.item>
                </f:if>
                <f:if condition="{object.bodytext}">
                    <layout:row.item class="{name}__text" width="{object.textColumnWidth}">
                        <element:text.rich text="{object.bodytext}"/>
                    </layout:row.item>
                </f:if>
            </layout:row>
        </div>

    </fc:renderer>
</fc:component>
