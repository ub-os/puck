<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-text-rich"/>
  <fc:param name="text" type="string"/>
  <fc:renderer>

    <f:if condition="{text}">
      <div class="{name} {class}" data-rich>
        <f:format.html>{text}</f:format.html>
      </div>
    </f:if>

  </fc:renderer>
</fc:component>
