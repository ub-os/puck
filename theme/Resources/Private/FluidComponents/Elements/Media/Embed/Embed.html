<fc:component>
    <fc:param name="name" type="string" optional="1" default="e-media-embed"/>
    <fc:param name="file" type="TYPO3\CMS\Core\Resource\FileReference"/>
    <fc:param name="width" type="integer" optional="1"/>
    <fc:param default="1" name="webp" optional="1" type="boolean"/>
    <fc:param default="1" name="retina" optional="1" type="boolean"/>
    <fc:param default="1" name="openInModal" optional="1" type="boolean"/>
    <fc:renderer>

        <f:variable name="id">{file.name}-{ub:math.random(min:1000,max:9999)}</f:variable>
        <f:variable name="options" value="{service:file.extension,id:file.contents,width:width}"/>
        <f:variable name="localPoster" value="{ub:utility.posterImage(src:'fileadmin{file.identifier}')}"/>
        <div aria-controls="{id}" class="{name}" data-video-embed="{options -> f:format.json()}">
            <f:if condition="{localPoster}">
                <f:then>
                    <element:picture
                            src="{localPoster}"
                            loading="lazy"
                            name="{name}"
                            retina="{retina}"
                            sources="{
                        xs: {width: width},
                        0: {width: 450}
                    }"
                            webp="{webp}"
                            width="{width}"/>
                </f:then>
                <f:else>
                    <img alt="{file.alternative}"
                         class="{name}__image"
                         loading="lazy"
                         src="{ub:utility.getOnlineMediaPoster(service:file.extension,id:file.contents)}">
                </f:else>
            </f:if>
            <f:if condition="!{openInModal}">
                <div class="{name}__frame" id="{id}">
                </div>
            </f:if>
            <div class="{name}__button">
                <icon:svg class="{name}__icon" icon="circle-play-duotone"/>
            </div>
            <f:if condition="{openInModal}">
                <layout:modal id="{id}" width="12">
                    <div style="padding-top: 56.25%"></div>
                </layout:modal>
            </f:if>
        </div>

    </fc:renderer>
</fc:component>
