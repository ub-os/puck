
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-media"/>
  <fc:param name="file" type="SMS\FluidComponents\Domain\Model\File" optional="1"/>
  <fc:param name="files" type="array" optional="1"/>
  <fc:param name="width" type="integer" optional="1"/>
  <fc:param name="sources" type="array" optional="1"/>
  <fc:param name="cropVariant" type="string" optional="1" default="default"/>
  <fc:param name="webp" type="boolean" optional="1" default="1"/>
  <fc:param name="retina" type="boolean" optional="1" default="1"/>
  <fc:param name="loading" type="string" optional="1" default="lazy"/>
  <fc:param name="additionalConfig" type="array" optional="1" default="{controls:1,autoplay:0,loop:0}"/>
  <fc:param name="showTitle" type="boolean" optional="1" default="0"/>
  <fc:param name="showDesc" type="boolean" optional="1" default="0"/>
  <fc:param name="backgroundImg" type="boolean" optional="1" default="0"/>
  <fc:param name="reserveHeight" type="string" optional="1"/>
  <fc:renderer>

    <f:variable name="filesP" value="{f:if(condition: file, then: '{0: file}', else: files)}"/>
    <f:if condition="{filesP}">
      <f:for each="{filesP}" as="file" iteration="i">
        <f:if condition="{file}">
          <f:if condition="{file.file}">
            <f:variable name="file" value="{file.file}"/>
          </f:if>
          <f:if condition="{file.originalResource}">
            <f:variable name="file" value="{file.originalResource}"/>
          </f:if>
          <f:variable name="type" value="{file.extension}"/>
          <div class="{name}__figure {class}">
            <f:if condition="{type} == 'jpeg' || {type} == 'jpg' || {type} == 'png' || {type} == 'gif' || {type} == 'webp'">
              <f:then>
                <element:picture
                        image="{file}"
                        name="{name}"
                        class="{name}__file"
                        cropVariant="{cropVariant}"
                        width="{width}"
                        retina="{retina}"
                        webp="{webp}"
                        backgroundImg="{backgroundImg}"
                        loading="{loading}"
                        reserveHeight="{reserveHeight}"
                        sources="{sources}"/>
              </f:then>
              <f:else if="{type} == 'svg'">
                <f:image image="{file}"
                         class="{name}__image {name}__file"
                         width="{width}"
                         absolute="true"
                         title="{file.title}" alt="{file.alternative}" />
              </f:else>
              <f:else if="{type} == 'youtube' || {type} == 'vimeo'">
                <div class="{name}__file {name}__{type}">
                  <element:media.embed file="{file}"
                                       width="{width}"/>
                </div>
              </f:else>
              <f:else>
                <f:media file="{file}"
                         width="{width}"
                         additionalConfig="{autoplay:additionalConfig.autoplay, controls:additionalConfig.controls, loop:additionalConfig.loop, playsinline:additionalConfig.autoplay, muted:additionalConfig.autoplay}"
                         class="{name}__{type} {name}__file"
                         title="{file.title}" alt="{file.alternative}" />
              </f:else>
            </f:if>
            <f:if condition="{showTitle} && {file.title}">
              <div class="{name}__image-title">{file.title}</div>
            </f:if>
            <f:if condition="{showDesc} && {file.description}">
              <figcaption class="{name}__image-desc">{file.description}</figcaption>
            </f:if>
          </div>
        </f:if>
      </f:for>
    </f:if>

  </fc:renderer>
</fc:component>
