
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-control-prev-next"/>
  <fc:param name="icon" type="string" optional="1" default="pfeil2"/>

  <fc:renderer>
    <div class="{name}__wrap {class}">
      <div class="{name}" data-glide-el="controls">
        <button class="{name}__button -left"
                data-glide-dir="<"
                aria-label="{f:translate(extensionName: 'theme', key: 'displayResults.previous')}">
          <icon:svg class="{name}__icon" icon="{icon}-links"/>
        </button>
        <button class="{name}__button -right"
                data-glide-dir=">"
                aria-label="{f:translate(extensionName: 'theme', key: 'displayResults.next')}">
          <icon:svg class="{name}__icon" icon="{icon}-rechts"/>
        </button>
      </div>
    </div>
  </fc:renderer>

</fc:component>
