<f:variable name="menu"
            value="{f:if(
            condition:data.parents,
            then:'{ubos:arr.merge(a:menu_selected,b:menu_sub)}',
            else:menu_selected)}"/>
<f:switch expression="{data.layout}">
    <f:defaultCase>
        <module:menu.list data="{data}"
                          menu="{menu}"
                          itemConfig="{body:0,cta:0,category:0}"/>
    </f:defaultCase>
</f:switch>
