# Load default processing options
imports:
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Processing.yaml" }
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml" }
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml" }

# Add configuration for the editor
# For complete documentation see http://docs.ckeditor.com/#!/api/CKEDITOR.config
editor:
  config:
    importModules:
      - '@ubos/ckeditor-icons'
      - '@ubos/ckeditor-puck-icons'

    contentsCss:
      - 'EXT:rte_ckeditor/Resources/Public/Css/contents.css'

    style:
      definitions:

        #Headlines

        #Paragraphs
        - { name: "Small paragraph", element: "p", classes: [ "-small" ] }
        - { name: "Large paragraph", element: "p", classes: [ "-large" ] }
        - { name: "Footnote paragraph", element: "p", classes: [ "-footnote" ] }
        - { name: "Quote paragraph", element: "p", classes: [ "-quote" ] }
        - { name: "Quote attribution paragraph", element: "p", classes: [ "-quoteAttribution" ] }
        - { name: "Like h2 paragraph", element: "p", classes: [ "h2" ] }
        - { name: "Like h3 paragraph", element: "p", classes: [ "h3" ] }
        - { name: "Button group", element: "p", classes: [ "e-buttonGroup" ] }
        - { name: "Button group without gutter", element: "p", classes: [ "e-buttonGroup", "-gutter-0" ] }

        # Headlines

        # link styles
        - { name: "Button", element: "span", classes: [ "e-button" ] }
        - { name: "Button + full-width", element: "span", classes: [ 'e-button', '-block' ] }
        - { name: "Button + icon left", element: "span", classes: [ 'e-button', '-icon-left' ] }
        - { name: "Button + icon right", element: "span", classes: [ 'e-button', '-icon-right' ] }

        #Lists

        #List items

        # Tables
        - { name: "Row layout table", element: "table", classes: [ "row-layout-table" ] }
        - { name: "Data table", element: "table", classes: [ "data-table" ] }

    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3' }

    toolbar:
      items:
        - removeFormat
        - undo
        - redo
        # grouping separator
        - '|'
        - selectAll
        - findAndReplace
        - '|'
        - link
        - horizontalLine
        - bold
        - italic
        - underline
        - strikethrough
        - subscript
        - superscript
        - softhyphen
        - '|'
        - bulletedList
        - numberedList
        - blockQuote
        - alignment
        - '|'
        - specialCharacters
        - Icons
        - '|'
        - insertTable
        - tableCellProperties
        - tableProperties
        - tableColumn
        - tableRow
        - mergeTableCells
        - '-'
        - style
        - heading
        - sourceEditing

    alignment:
      options:
        - { name: 'left', className: 'u-text-left' }
        - { name: 'center', className: 'u-text-center' }
        - { name: 'right', className: 'u-text-right' }
        - { name: 'justify', className: 'u-text-just§ify' }


    extraAllowedContent: "span(*); *(*)[data-*]; p[data-*]; a[data-*]; a span; span i; span a;"

    qtRows: 20
    qtColumns: 6

    htmlSupport:
      allow:

processing:
  allowTags:
    - wbr