# Load default processing options
imports:
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Processing.yaml" }
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml" }
  - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml" }

# Add configuration for the editor
# For complete documentation see http://docs.ckeditor.com/#!/api/CKEDITOR.config
editor:
  config:
    height: '65px'
    toolbar:
    contentsCss:
      - 'EXT:puck/Resources/Public/css/be-ck-contents.css'
      - 'EXT:rte_ckeditor/Resources/Public/Css/contents.css'

    stylesSet:
      #Paragraphs
      - { name: "Intro paragraph", element: "p", attributes: { class: "-intro" } }

      #Headlines
      # link styles

      #Lists

      #List items

    format_tags: "h2;h3"

    toolbarGroups:
      - { name: styles, groups: [ Format ] }
      - { name: basicstyles, groups: [ basicstyles ] }
      - { name: paragraph, groups: [ align ] }
      - { name: links, groups: [ links ] }
      - { name: document, groups: [ mode ] }

    alignment:
      options:
        - { name: 'left', className: 'u-text-left' },
        - { name: 'center', className: 'u-text-center' }
        - { name: 'right', className: 'u-text-right' }
        - { name: 'justify', className: 'u-text-justify' }

    justifyClasses:
      - u-text-left
      - u-text-center
      - u-text-right
      - u-text-justify

    extraPlugins:
      - justify

    removePlugins:
      - media

    removeButtons:
      - Anchor
      - Strike


processing:
