services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  UBOS\Puck\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  UBOS\Puck\EventListener\AdditionalPropertiesForSearchAction:
    tags:
      - name: event.listener
        identifier: 'puck/additionalPropertiesForSearchAction'
  UBOS\Puck\EventListener\ModifyRecordList:
    tags:
      - name: event.listener
        identifier: 'puck/modifyRecordList'
        method: modifyRecordActions
  UBOS\Puck\EventListener\ModifyNewContentElementWizard:
    tags:
      - name: event.listener
        identifier: 'puck/modifyNewContentElementWizard'
