routeEnhancers:
  PageMenu:
    # class will add the value of 'route_pageMenu_limitToPages' as limit
    limitToPages: UBOS\Puck\Routing\AddRoutesToSiteConfiguration
    type: Extbase
    extension: Puck
    plugin: PageMenu
    routes:
      - routePath: '/{categoryLabel}:{demand/categories/0/uids}/{pageLabel}-{page}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/{categoryLabel}:{demand/categories/0/uids}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/{pageLabel}-{page}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/'
        _controller: 'PageMenu::pageMenu'
    aspects:
      pageLabel:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'de_DE.*'
            value: 'seite'
      categoryLabel:
        type: LocaleModifier
        default: 'category'
        localeMap:
          - locale: 'de_DE.*'
            value: 'kategorie'
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'
      demand/categories/0/uids:
        type: PersistedAliasListMapper
        tableName: sys_category
        routeFieldName: slug
        slugSeparator: '.'