routeEnhancers:
  PageMenu:
    type: Extbase
    extension: Puck
    plugin: PageMenu
    limitToPages: '%routeEnhancerPages.pageMenu%'
    routes:
      -
        routePath: '/{categoryLabel}:{demand/categories/0/uids}/{authorLabel}:{demand/authors}/{pageLabel}-{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/{categoryLabel}:{demand/categories/0/uids}/{authorLabel}:{demand/authors}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/{categoryLabel}:{demand/categories/0/uids}/{pageLabel}-{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/{authorLabel}:{demand/authors}/{pageLabel}-{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/{categoryLabel}:{demand/categories/0/uids}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/{authorLabel}:{demand/authors}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/{pageLabel}-{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/c{object}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/'
        _controller: 'Menu::pageMenu'
    aspects:
      pluginPrefix:
        type: LocaleModifier
        default: 'menu'
        localeMap:
          - locale: 'de_DE.*'
            value: 'menu'
      pageLabel:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'de_DE.*'
            value: 'seite'
      categoryLabel:
        type: LocaleModifier
        default: 'category'
        localeMap:
          - locale: 'de_DE.*'
            value: 'kategorie'
      authorLabel:
        type: LocaleModifier
        default: 'author'
        localeMap:
          - locale: 'de_DE.*'
            value: 'autor'
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'
      demand/categories/0/uids:
        type: PersistedAliasMapperOfCommaList
        tableName: sys_category
        routeFieldName: slug
        slugSeparator: '.'
      demand/authors:
        type: PersistedAliasMapperOfCommaList
        tableName: tx_puck_domain_model_person
        routeFieldName: slug
        slugSeparator: '.'