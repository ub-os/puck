routeEnhancers:
  PageMenu:
    limitToPages: '%route_pageMenu_limitToPages%'
    type: Extbase
    extension: Puck
    plugin: PageMenu
    routes:
      #      -
      #        routePath: '/{categoryLabel}:{demand/categories/0/uids}/{authorLabel}:{demand/authors}/{pageLabel}-{page}'
      #        _controller: 'PageMenu::pageMenu'
      #      -
      #        routePath: '/{categoryLabel}:{demand/categories/0/uids}/{authorLabel}:{demand/authors}'
      #        _controller: 'PageMenu::pageMenu'
      #      -
      #        routePath: '/{authorLabel}:{demand/authors}'
      #        _controller: 'PageMenu::pageMenu'
      #      -
      #        routePath: '/{authorLabel}:{demand/authors}/{pageLabel}-{page}'
      #        _controller: 'PageMenu::pageMenu'
      - routePath: '/{categoryLabel}:{demand/categories/0/uids}/{pageLabel}-{page}/c{recordUid}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/{categoryLabel}:{demand/categories/0/uids}/c{recordUid}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/{categoryLabel}:{demand/categories/0/uids}/{pageLabel}-{page}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/{pageLabel}-{page}/c{recordUid}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/{categoryLabel}:{demand/categories/0/uids}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/{pageLabel}-{page}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/c{recordUid}'
        _controller: 'PageMenu::pageMenu'
      - routePath: '/'
        _controller: 'PageMenu::pageMenu'
    aspects:
      pluginPrefix:
        type: LocaleModifier
        default: 'menu'
        localeMap:
          - locale: 'de_DE.*'
            value: 'menu'
      pageLabel:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'de_DE.*'
            value: 'seite'
      categoryLabel:
        type: LocaleModifier
        default: 'category'
        localeMap:
          - locale: 'de_DE.*'
            value: 'kategorie'
      authorLabel:
        type: LocaleModifier
        default: 'author'
        localeMap:
          - locale: 'de_DE.*'
            value: 'autor'
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'
      demand/categories/0/uids:
        type: PersistedAliasListMapper
        tableName: sys_category
        routeFieldName: slug
        slugSeparator: '.'
      demand/authors:
        type: PersistedAliasListMapper
        tableName: tx_puck_domain_model_person
        routeFieldName: slug
        slugSeparator: '.'