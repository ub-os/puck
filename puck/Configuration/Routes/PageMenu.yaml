routeEnhancers:
  PageMenu:
    type: Extbase
    extension: Puck
    plugin: PageMenu
    routes:
      -
        routePath: '/~{pluginPrefix}/{categoryLabel}_{demand/categories/0/uids}/{authorLabel}_{demand/authors}/{pageLabel}_{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/~{pluginPrefix}/{categoryLabel}_{demand/categories/0/uids}/{authorLabel}_{demand/authors}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/~{pluginPrefix}/{categoryLabel}_{demand/categories/0/uids}/{pageLabel}_{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/~{pluginPrefix}/{authorLabel}_{demand/authors}/{pageLabel}_{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/~{pluginPrefix}/{categoryLabel}_{demand/categories/0/uids}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/~{pluginPrefix}/{authorLabel}_{demand/authors}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/~{pluginPrefix}/{pageLabel}_{page}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/~{pluginPrefix}/c{object}'
        _controller: 'Menu::pageMenu'
      -
        routePath: '/'
        _controller: 'Menu::pageMenu'
    aspects:
      pluginPrefix:
        type: LocaleModifier
        default: 'menu'
        localeMap:
          - locale: 'de_DE.*'
            value: 'menu'
      pageLabel:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'de_DE.*'
            value: 'seite'
      categoryLabel:
        type: LocaleModifier
        default: 'category'
        localeMap:
          - locale: 'de_DE.*'
            value: 'kategorie'
      authorLabel:
        type: LocaleModifier
        default: 'author'
        localeMap:
          - locale: 'de_DE.*'
            value: 'autor'
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'
      demand/categories/0/uids:
        type: PersistedAliasMapperOfCommaList
        tableName: sys_category
        routeFieldName: slug
        slugSeparator: '.'
      demand/authors:
        type: PersistedAliasMapperOfCommaList
        tableName: tx_puck_domain_model_person
        routeFieldName: slug
        slugSeparator: '.'
