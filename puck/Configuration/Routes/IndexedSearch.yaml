routeEnhancers:
  IndexedSearch:
    # class will add the value of 'route_indexedSearch_limitToPages' as limit
    limitToPages: UBOS\Puck\Routing\AddRoutesToSiteConfiguration
    type: Extbase
    namespace: tx_indexedsearch_pi2
    routes:
      - routePath: '/{results-label}'
        _controller: 'Search::search'
      - routePath: '/{results-label}::{search/sword}'
        _controller: 'Search::search'
        requirements:
          - search/sword: '[^/=?]*'
    aspects:
      results-label:
        type: LocaleModifier
        default: 's'
        localeMap:
          - locale: 'de_DE.*'
            value: 's'