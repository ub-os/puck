routeEnhancers:
  PersonListPageType:
    type: PageType
    index: ''
    map:
      /personList: 16500002
  PersonList:
    type: Extbase
    extension: Puck
    plugin: PersonList
    routes:
      -
        routePath: '/{pageLabel}/{page}'
        _controller: 'Person::list'
      -
        routePath: '/'
        _controller: 'Person::list'
    aspects:
      pageLabel:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'de_DE.*'
            value: 'seite'
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'