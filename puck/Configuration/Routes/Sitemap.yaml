routeEnhancers:
  SitemapPage:
    # class will add the root page as limit
    limitToPages: UBOS\Puck\Routing\AddRoutesToSiteConfiguration
    type: PageType
    index: 'sitemap-index'
    map:
      .xml: 1533906435
  Sitemap:
    # class will add the root page as limit
    limitToPages: UBOS\Puck\Routing\AddRoutesToSiteConfiguration
    type: Simple
    routePath: '{sitemap}'
    aspects:
      sitemap:
        type: StaticValueMapper
        map:
          sitemap-index: ''
          sitemap: pages
          sitemap-news: news
