routeEnhancers:
  PostList:
    type: Extbase
    extension: Puck
    plugin: PostList
    routes:
      -
        routePath: '/{categoryLabel}/{categoryList}/{authorLabel}/{authorList}/{pageLabel}/{page}'
        _controller: 'Post::list'
      -
        routePath: '/{categoryLabel}/{categoryList}/{authorLabel}/{authorList}'
        _controller: 'Post::list'
      -
        routePath: '/{categoryLabel}/{categoryList}/{pageLabel}/{page}'
        _controller: 'Post::list'
      -
        routePath: '/{categoryLabel}/{categoryList}'
        _controller: 'Post::list'
      -
        routePath: '/{authorLabel}/{authorList}/{pageLabel}/{page}'
        _controller: 'Post::list'
      -
        routePath: '/{authorLabel}/{authorList}'
        _controller: 'Post::list'
      -
        routePath: '/{pageLabel}/{page}'
        _controller: 'Post::list'
      -
        routePath: ''
    aspects:
      pageLabel:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'de_DE.*'
            value: 'seite'
      categoryLabel:
        type: LocaleModifier
        default: 'category'
        localeMap:
          - locale: 'de_DE.*'
            value: 'kategorie'
      authorLabel:
        type: LocaleModifier
        default: 'author'
        localeMap:
          - locale: 'de_DE.*'
            value: 'autor'
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'
      categoryList:
        type: PersistedAliasMapperOfCommaList
        tableName: sys_category
        routeFieldName: slug
      authorList:
        type: PersistedAliasMapperOfCommaList
        tableName: tx_puck_domain_model_author
        routeFieldName: slug