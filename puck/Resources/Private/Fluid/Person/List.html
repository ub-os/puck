<f:variable name="footerContent">
    <f:if condition="{pagination}">
        <element:plugin.pagination
                pagination="{pagination}"
                fetchConfig="{
                    pageType: 16500002,
                    rootNodeId: 'c{object.uid}',
                    arguments: '{object:object}'
                }"
                actionLink="{
                    action:'list',
                    controller:'Person',
                    pageUid:object.pid,
                    arguments:arguments}"
        />
    </f:if>
</f:variable>
<module:menu.pages object="{object}"
                   footerContent="{footerContent}"/>
