<page-root
        id="root"
        class="-layout-{record.backend_layout} "
        hx-boost="true"
        hx-swap="innerHTML"
        hx-indicator="#root-loading-bar"
        preload="mousedown"
        data-logger="{f:if(condition:'{context.backendUser}', then:'enabled')}">
	<div data-controller="anchor-handler scrollbar-width"></div>
	<!--TYPO3SEARCH_end-->
    <f:if condition="{record.backend_layout} !== 'pagets__error'">
        <module:schema record="{record}" context="{context}"/>
        <module:header record="{record}" context="{context}"/>
    </f:if>
    <!--TYPO3SEARCH_begin-->
    <module:main record="{record}">
        {contentElements.colPos2 -> f:format.raw()}
        {contentElements.colPos1 -> f:format.raw()}
    </module:main>
    <!--TYPO3SEARCH_end-->
    <f:if condition="{record.backend_layout} !== 'pagets__error'">
        <module:footer record="{record}">
            {contentElements.colPos3 -> f:format.raw()}
        </module:footer>
    </f:if>
    <module:main.toTop/>
    <div id="modal-container">
        {contentElements.colPos9 -> f:format.raw()}
    </div>
    <div id="root-loading-bar"></div>
</page-root>
