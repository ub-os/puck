
<module:menu.pages object="{object}">
    <f:if condition="{filter.categories}">
            <element:plugin.filter
                    filter="{filter}"
                    actionLink="{action:'list',controller:'Post',pageUid:object.pid,arguments:arguments,section:'c{object.uid}'}"/>
    </f:if>
</module:menu.pages>

<f:if condition="{pagination}">
    <layout:section object="{frameClass:object.frameClass,hasNoHeaderSpacing:true}" top="none">
        <element:plugin.pagination
                pagination="{pagination}"
                actionLink="{action:'list',controller:'Post',pageUid:object.pid,arguments:arguments,section:'c{object.uid}'}"/>
    </layout:section>
</f:if>
