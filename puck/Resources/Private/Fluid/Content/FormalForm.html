<f:variable name="name" value="formal"/>
<f:variable name="formElementId" value="c{content.uid}-{form.uid}-form"/>
<layout:section>
	<f:form class="{name}__form"
			data-hx-boost="{f:if(condition:'{isLastStep}',then:'false',else:'false')}"
			action="formalForm"
			id="{formElementId}"
			name="{formName}"
			enctype="multipart/form-data"
			data-action="{f:uri.action(action:action,arguments:{step:nextStep})}">
		<h2>{form.title}</h2>
		<script>
			const _form = document.currentScript.parentElement
			_form.addEventListener('focusin', () => _form.action = _form.dataset.action)
		</script>
		<div>
			<f:form.textfield autocomplete="off" name="__email" id="f000" tabindex="-1"/>
			<style>#f000 {position:absolute;margin-left:-999em}</style>
		</div>

		<f:if condition="{session}">
			<div data-session>
				<f:form.hidden name="session[id]" value="{session.id}"/>
				<f:form.hidden name="session[prevStep]" value="{step}"/>
				<f:for each="{session.filenames}" as="value" key="key">
					<f:form.hidden name="session[filenames][{key}]" value="{value}"/>
				</f:for>
				<f:for each="{session.prevStepValues}" as="value" key="identifier">
					<f:if condition="{value.0}">
						<f:then>
							<f:for each="{value}" as="valueItem" iteration="i">
								<f:form.hidden name="{formName}[{identifier}][]" value="{valueItem}"/>
							</f:for>
						</f:then>
						<f:else>
							<f:form.hidden property="{identifier}" value="{value}"/>
						</f:else>
					</f:if>
				</f:for>
			</div>
		</f:if>

		<div class="{name}__step">
			<div class="{name}__step__header">
				<h3>{currentStepRecord.title}</h3>
			</div>
			<fieldset class="{name}__fieldset">
			<f:for each="{currentStepRecord.fields}" as="field">
				<f:render partial="Fieldwrap" arguments="{_all}" contentAs="content">
					<f:switch expression="{field.type}">
						<f:case value="textarea">
							<f:render section="label" arguments="{_all}"/>
							<f:form.textarea property="{field.identifier}"
											 value="{field.value}"
											 additionalAttributes="{u:formFieldAttribute(record:field)}"
											 id="{record.uid}-{field.identifier}"/>
						</f:case>
						<f:case value="single-checkbox">
							<f:form.checkbox property="{field.identifier}"
											 checked="{field.value}"
											 value="1"
											 additionalAttributes="{u:formFieldAttribute(record:field)}"
											 id="{record.uid}-{field.identifier}"/>
							<f:render section="label" arguments="{_all}"/>
						</f:case>
						<f:case value="checkbox">
							<f:render section="label" arguments="{_all}"/>
							<f:for each="{field.field_options}" as="option">
								<f:form.checkbox property="{field.identifier}"
												 checked="{field.selectedOptions.{option.value}}"
												 multiple="1"
												 value="{option.value}"
												 additionalAttributes="{u:formFieldAttribute(record:field)}"
												 id="{record.uid}-{field.identifier}-{option.value}"/>
								<label class="{name}__label" for="{record.uid}-{field.identifier}-{option.value}">{option.label}</label>
							</f:for>
							<script>
								const checks = document.currentScript.parentNode.querySelectorAll('[type="checkbox"]');
							</script>
						</f:case>
						<f:case value="radio">
							<f:render section="label" arguments="{_all}"/>
							<f:for each="{field.field_options}" as="option">
								<f:form.radio property="{field.identifier}"
											  checked="{field.value} == {option.value}"
											  value="{option.value}"
											  additionalAttributes="{u:formFieldAttribute(record:field)}"
											  id="{record.uid}-{field.identifier}-{option.value}"/>
								<label class="{name}__label" for="{record.uid}-{field.identifier}-{option.value}">{option.label}</label>
							</f:for>
						</f:case>
						<f:case value="select">
							<f:render section="label" arguments="{_all}"/>
							<f:form.select property="{field.identifier}"
										   additionalAttributes="{u:formFieldAttribute(record:field)}"
										   id="{record.uid}-{field.identifier}">
								<f:for each="{field.field_options}" as="option">
									<f:form.select.option
										selected="{field.selectedOptions.{option.value}}"
										value="{option.value}">{option.label}</f:form.select.option>
								</f:for>
							</f:form.select>
						</f:case>
						<f:case value="hidden">
							<f:form.hidden property="{field.identifier}"
										   value="{field.value}"
										   id="{record.uid}-{field.identifier}"/>
						</f:case>
						<f:case value="rte">
							<element:richText text="{field.description}"/>
						</f:case>
						<f:case value="captcha">
							captcha?
						</f:case>
						<f:case value="file">
							<f:render section="label" arguments="{_all}"/>
							<f:if condition="{session.filenames.{field.identifier}}">
								<span>{session.filenames.{field.identifier}}</span>
							</f:if>
							<f:form.upload property="{field.identifier}"
										   type="{field.type}"
										   value="{field.value}"
										   additionalAttributes="{u:formFieldAttribute(record:field)}"
										   id="{record.uid}-{field.identifier}"/>
						</f:case>
						<f:defaultCase>
							<f:render section="label" arguments="{_all}"/>
							<f:form.textfield property="{field.identifier}"
											  type="{field.type}"
											  value="{field.value}"
											  additionalAttributes="{u:formFieldAttribute(record:field)}"
											  id="{record.uid}-{field.identifier}"/>
						</f:defaultCase>
					</f:switch>
				</f:render>
			</f:for>
			</fieldset>
		</div>
		<f:if condition="!{isFirstStep}">
			<button type="submit" class="e-button"
					formnovalidate
					formaction="{f:uri.action(action:'formalFormStep', arguments:{step:previousStep}, section:formElementId)}">
				{currentStepRecord.prev_label}
			</button>
		</f:if>
		<button type="submit" class="e-button">
			{currentStepRecord.next_label}
		</button>
	</f:form>
</layout:section>

<f:section name="label">
	<label class="{name}__label" for="{record.uid}-{field.identifier}">{field.label}</label>
</f:section>
