<f:if condition="{inline_media}">
    <f:variable name="items"
                value="{puck:utility.backend.getRecords(table: 'tx_puck_domain_model_inline_media', where: 'parent_uid={uid}', sorting: 'sorting')}"/>
    <div class="panel-group" id="c{uid}-panel-group">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title" id="simple-heading-panel1">
                    <a href="#" class="collapsed" data-bs-toggle="collapse" data-bs-target="#c{uid}-inline-collapse" aria-expanded="false" aria-controls="c{uid}-inline-collapse">
                        <span class="caret"></span>
                        <core:icon identifier="{items.0.item_type}_inline_media" /> <span id="c{uid}-inline-panel">Items (<f:count>{items}</f:count>)</span>
                        <div class="headers" style="font-weight: normal; color: black;">
                            <ul class="header">
                                <f:for each="{items}" as="item" iteration="i">
                                    <li>
                                        <f:if condition="{item.header}">
                                            <f:then>{item.header}</f:then>
                                            <f:else if="{item.bodytext}">{item.bodytext -> f:format.stripTags() -> f:format.crop(maxCharacters:50)}</f:else>
                                            <f:else><em>-</em> </f:else>
                                        </f:if>
                                    </li>
                                </f:for>
                            </ul>
                        </div>
                    </a>
                </h3>
            </div>
            <div id="c{uid}-inline-collapse" class="collapse" aria-labelledby="c{uid}-inline-panel">
                <div class="panel-body">
                    <f:for each="{items}" as="item" iteration="i">
                        <div class="item-col -col {f:if(condition:'{item.hidden}',then:' t3-page-ce-hidden t3js-hidden-record')}" style="">
                            <div class="t3-page-ce-header" style="align-items: center">
                                <core:icon identifier="{item.item_type}_inline_media" overlay="{f:if(condition:'{item.hidden}',then:'overlay-hidden')}"/>
                                <div class="btn-toolbar" style="margin-left: auto">
                                    <div class="btn-group btn-group-sm">
                                        <be:link.editRecord class="btn btn-default" uid="{item.uid}" table="tx_puck_domain_model_inline_media" returnUrl="{be:moduleLink(route:'web_layout', arguments:'{id:item.pid}')}#element-tt_content-{uid}" >
                                            <core:icon identifier="actions-open"/>
                                        </be:link.editRecord>
                                        <a class="btn btn-default" href="{puck:utility.backend.uri.toggleRecordVisibility(record:item,table:'tx_puck_domain_model_inline_media')}#element-tt_content-{uid}">
                                            <core:icon identifier="actions-edit-{f:if(condition:'{item.hidden}',then:'unhide',else:'hide')}" />
                                        </a>
                                        <a class="btn btn-default t3js-modal-trigger"
                                           href="{puck:utility.backend.uri.deleteRecord(record:item,table:'tx_puck_domain_model_inline_media')}#element-tt_content-{uid}"
                                           data-severity="warning"
                                           data-title="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_alt_doc.xlf:label.confirm.delete_record.title')}"
                                           data-bs-content="{item.deleteMessage}"
                                           data-button-close-text="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:cancel')}"
                                           data-button-ok-text="{f:translate(key:'LLL:EXT:core/Resources/Private/Language/locallang_mod_web_list.xlf:delete')}"
                                           title="{f:translate(key: 'LLL:EXT:backend/Resources/Private/Language/locallang_layout.xlf:deleteItem')}">
                                            <core:icon identifier="actions-edit-delete" size="small" />
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div class="t3-page-ce-body">

                                <div class="t3-page-ce-body-inner">

                                    <strong>
                                        <small>
                                            <f:translate key="LLL:EXT:puck/Resources/Private/Language/locallang.xlf:wizard.{puck:string.replace(search:'puck_',replace:'',subject:CType)}" />
                                            item
                                        </small>
                                    </strong>
                                    <f:render partial="PageLayout/RecordDefault/Preview/Text"
                                              arguments="{header: item.header, headerType: 'h3', subheader: item.subheader, bodytext: item.bodytext}"/>
                                    <f:render partial="PageLayout/RecordDefault/Preview/FileThumbs" arguments="{row: item, files: item.assets, field: 'assets', table: 'tx_puck_domain_model_inline_media'}" />
                                </div>
                            </div>
                        </div>
                    </f:for>
                </div>
            </div>
        </div>
    </div>
</f:if>
