
<f:if condition="{subheader}">
    <p>{subheader -> f:format.raw()}</p>
</f:if>
<f:if condition="{header}">
    <{headerType}>{header -> f:format.raw()}</{headerType}>
</f:if>
<f:if condition="{bodytext}">
    <div style="padding-bottom: 1em">{bodytext -> f:format.stripTags() -> f:format.nl2br()}</div>
</f:if>
