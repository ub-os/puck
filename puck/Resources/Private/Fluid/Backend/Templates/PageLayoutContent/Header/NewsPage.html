{namespace be = TYPO3\CMS\Backend\ViewHelpers}
<div class="callout callout-info">
    <div class="media">
        <div class="media-left">
            <core:icon identifier="news_page" size="medium" />
        </div>
        <div class="media-body">
            <h4 class="callout-title">
                News page
            </h4>
            <div class="callout-body">
                <table>
                    <tbody>
                    <style>th {padding-right: 1em}</style>
                    <tr><th>                <f:if condition="{record}">
                        <f:then>Published</f:then>
                        <f:else>Deactivated</f:else>
                    </f:if></th></tr>
                    <tr><th>Date</th><td> <f:format.date format="d.m.Y">{record.post_date}</f:format.date></td></tr>
                    <f:if condition="{record.post_author}">
                        <tr><th>Author</th><td>{record.post_author.name}</td></tr>
                    </f:if>
                    </tbody>
                </table>
                <p></p>
                Hero and author content elements are automatically rendered from page data.
            </div>
            <div class="callout-footer" style="padding-top: 1em">
                <be:link.editRecord uid="{record.uid}" table="pages" class="btn btn-default" returnUrl="{be:moduleLink(route:'web_layout', arguments:'{id:record.uid}')}">
                    <core:icon identifier="actions-open" />
                    Edit page data
                </be:link.editRecord>
                <a href="{be:moduleLink(route:'web_list', arguments:'{id:record.pid}')}" class="btn btn-primary">
                    <core:icon identifier="actions-list" />
                    News overview
                </a>
            </div>
        </div>
    </div>

</div>
