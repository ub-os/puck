<f:variable name="show_layout"
            value="{f:if(condition:'{record.layout} != \'default\' && {record.layout}',
            then:1,else:0)}"/>
<f:variable name="show_frame_class"
            value="{f:if(condition:'{record.frame_class} != \'default\' && {record.frame_class}',
            then:1,else:0)}"/>
<f:variable name="show_space_before"
            value="{f:if(condition:'{record.space_before}',
            then:1,else:0)}"/>
<f:variable name="show_space_after"
            value="{f:if(condition:'{record.space_after}',
            then:1,else:0)}"/>
<f:variable name="show_container_width"
            value="{f:if(condition:'{record.container_width} && {record.container_width} != 12',
            then:1,else:0)}"/>
<f:variable name="show_container_position"
            value="{f:if(condition:'{record.container_position} && {record.container_position} != \'center\'',
            then:1,else:0)}"/>
<f:variable name="show_container_offset"
            value="{f:if(condition:'{record.container_offset}',
            then:1,else:0)}"/>

<f:variable name="show_media_layout"
            value="{f:if(condition:'({record.CType} == \'puck_media\' || {record.CType} == \'puck_media_column\' || {record.CType} == \'puck_card\' ||{record.CType} == \'puck_cover_media\' || {record.CType} == \'puck_modal\') &&  {record.media_layout}',
            then:1,else:0)}"/>

<f:if condition="
    {show_layout} ||
    {show_container_width} ||
    {show_container_position} ||
    {show_container_offset} ||
    {show_frame_class} ||
    {show_space_before} ||
    {show_space_after} ||
    {show_media_layout}
">
    <div style="padding-inline:var(--pagemodule-grid-spacing);">
        <f:if condition="{show_layout}">
            <f:render section="footer_col" arguments="{col: 'layout', item: item}"/>
        </f:if>
        <f:if condition="{show_media_layout}">
            <f:render section="footer_col" arguments="{col: 'media_layout', item: item}"/>
        </f:if>
        <f:if condition="{show_frame_class}">
            <f:render section="footer_col" arguments="{col: 'frame_class', item: item}"/>
        </f:if>
        <f:if condition="{show_container_width}">
            <f:render section="footer_col" arguments="{col: 'container_width', item: item}"/>
        </f:if>
        <f:if condition="{show_container_offset}">
            <f:render section="footer_col" arguments="{col: 'container_offset', item: item}"/>
        </f:if>
        <f:if condition="{show_container_position}">
            <f:render section="footer_col" arguments="{col: 'container_position', item: item}"/>
        </f:if>
        <f:if condition="{show_space_before}">
            <f:render section="footer_col" arguments="{col: 'space_before', item: item}"/>
        </f:if>
        <f:if condition="{show_space_after}">
            <f:render section="footer_col" arguments="{col: 'space_after', item: item}"/>
        </f:if>
    </div>
</f:if>

<f:section name="footer_col">
    <div class="{col}">
        <f:format.raw>
            <u:utility.backend.getProcessedValue table="tt_content" col="{col}" value="{item.record.{col}}"/>
        </f:format.raw>
    </div>
</f:section>
