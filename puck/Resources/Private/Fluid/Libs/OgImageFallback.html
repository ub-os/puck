<f:if condition="{files}">
    <f:then>
        <f:variable name="url" value="{f:uri.image(image: files.0, cropVariant: 'social', absolute: '1', width: '1200')}"/>
        <meta property="og:image" content="{url}">
        <meta property="og:image:url" content="{url}">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
    </f:then>
    <f:else>
        <f:variable name="url" value="{f:uri.image(src: 'EXT:puck/Resources/Public/Icons/Logos/default.svg', absolute: '1')}"/>
        <meta property="og:image" content="{url}">
        <meta property="og:image:url" content="{url}">
    </f:else>
</f:if>
