<f:variable name="headerContent">
    <module:menu.control.filter categoryFilter="{categoryFilter}" id="c{object.uid}-filter"/>
</f:variable>
<f:variable name="footerContent">
    <f:if condition="{pagination}">
        <module:menu.control.pagination pagination="{pagination}"/>
    </f:if>
</f:variable>
<module:menu.pages object="{object}"
                   headerContent="{headerContent -> f:spaceless() -> f:format.raw()}"
                   footerContent="{footerContent -> f:spaceless() -> f:format.raw()}"/>
