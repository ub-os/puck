<f:variable name="headerContent">
    <module:menu.filter categoryFilter="{categoryFilter}" sectionId="c{object.uid}"/>
</f:variable>
<f:variable name="footerContent">
    <module:menu.pagination pagination="{pagination}" sectionId="c{object.uid}"/>
</f:variable>
<module:menu object="{object}"
             headerContent="{headerContent -> f:spaceless() -> f:format.raw()}"
             footerContent="{footerContent -> f:spaceless() -> f:format.raw()}"/>
