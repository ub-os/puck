
<f:argument name="name" type="string" optional="1" default="m-media"/>
<f:argument name="record" type="mixed"/>

<f:if condition="{record.colPos} < 600">
	<f:then>
		<layout:section
			class="{name}__wrap"
			record="{record}">
			<f:render section="InnerContent" arguments="{_all}"/>
		</layout:section>
	</f:then>
	<f:else>
		<layout:row.item
			class="{name}__row__item"
			width="{record.container_width}"
			attributes="{id:'c{record.uid}'}">
			<f:render section="InnerContent" arguments="{_all}"/>
		</layout:row.item>
	</f:else>
</f:if>

<f:section name="InnerContent">
	<element:moduleHeader record="{record}"/>
	<layout:media
		media="{record.assets}"
		text="{record.bodytext}"
		layout="{record.media_layout}"
		justify="{record.row_justify}"
		align="{record.row_align}"
		mediaWidth="{record.media_column_width}"
		textWidth="{record.text_column_width}"
		itemWidth="{record.item_column_width}"
		mediaMobileMaxVh="{record.media_max_height}"/>
</f:section>
