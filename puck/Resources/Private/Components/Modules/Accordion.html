
<f:argument name="name" type="string" optional="1" default="m-accordion"/>
<f:argument name="record" type="mixed"/>


<details class="{name}"
		 data-controller="accordion"
		 data-accordion.duration="150"
		 data-accordion.group-id="c{record.tx_container_parent.uid}"
		 aria-labelledby="c{record.uid}-button"
		 id="c{record.uid}">
	<summary class="{name}__button"
			 data-action="accordion.toggle"
			 aria-controls="c{record.uid}"
			 id="c{record.uid}-button">
		<span class="{name}__title">{record.header -> f:format.raw()}</span>
		<icon:char class="{name}__icon" icon="angle-down-regular" />
	</summary>

	<div class="{name}__content">
		<layout:media
			media="{record.assets}"
			text="{record.bodytext}"
			layout="{record.media_layout}"
			justify="{record.row_justify}"
			align="{record.row_align}"
			mediaWidth="{record.media_column_width}"
			textWidth="{record.text_column_width}"
			mediaMobileMaxVh="{record.media_max_height}"
			itemWidth="{record.item_column_width}"/>
	</div>
</details>
