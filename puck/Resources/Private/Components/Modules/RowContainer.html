
<f:argument name="name" type="string" optional="1" default="m-rowContainer"/>
<f:argument name="record" type="mixed"/>
<f:argument name="children_600" type="array" optional="1"/>

<layout:section
	class="{name}__wrap"
	record="{record}">
	<element:moduleHeader record="{record}"/>
	<element:richText record="{record}" class="{name}__bodytext"/>
	<f:switch expression="{record.layout}">

		<f:case value="carousel">
			<f:variable name="optionsArray" value="{record.options -> u:mergedFlexFormSheets()}"/>
			<layout:carousel id="c{record.uid}-splide"
							 class="{name}__carousel"
							 align="{record.row_align}"
							 carouselAttributes="{optionsArray.carousel}">
				<f:for each="{children_600}" as="child">
					<layout:row.item
						class="splide__slide {name}__item {f:if(condition:'{record.row_align} === \'stretch\'', then:'-stretchContent')}"
						width="{child.container_width}">
						{child.renderedContent -> f:format.raw()}
					</layout:row.item>
				</f:for>
			</layout:carousel>
		</f:case>

		<f:defaultCase>
			<layout:row class="{name}__row"
						justify="{record.row_justify}"
						align="{record.row_align}"
						flexGrow="{record.flex_grow}">
				<f:for each="{children_600}" as="child">
					{child.renderedContent -> f:format.raw()}
				</f:for>
			</layout:row>
		</f:defaultCase>

	</f:switch>

</layout:section>
