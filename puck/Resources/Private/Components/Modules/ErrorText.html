
<f:argument name="name" type="string" optional="1" default="m-errorText"/>
<f:argument name="record" type="mixed"/>


<layout:section
	class="{u:prependClass()}{name}__wrap"
	record="{record}">
	<div class="{name}">
		<h1 class="{name}__header">
			{record.header}
		</h1>
		<p class="{name}__subheader">
			{record.subheader}
		</p>
		<f:slot/>
		<a href="/">
			<f:image class="{name}__logo" src="EXT:puck/Resources/Public/Images/Logos/default.svg"/>
		</a>
		<element:richText text="{record.bodytext}"/>
	</div>
</layout:section>
