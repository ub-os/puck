
<fc:component>
  <fc:param name="name" type="string" optional="1" default="l-section"/>
  <fc:param name="id" type="string" optional="1"/>
  <fc:param name="top" type="string" optional="1" default="auto"/>
  <fc:param name="bottom" type="string" optional="1" default="auto"/>
  <fc:param name="container" type="boolean" optional="1" default="1" />
  <fc:param name="customContainer" type="string" optional="1" default="" />
  <fc:param name="object" type="mixed" optional="1"/>
  <fc:param name="attributes" type="array" optional="1"/>
  <fc:renderer>

    <section class="{u:bem(
               raw:class,
               mod:{
                  background: object.frameClass,
                  layout: object.layout,
                  top: top,
                  bottom: bottom,
                  no-h2-spacing: object.hasNoHeaderSpacing}
             )}"
             id="{id}"
             {attributes -> u:renderAttributes()}>
      <f:if condition="!{container}">
        <f:then>
          <fc:slot name="content"/>
        </f:then>
        <f:else if="{customContainer}">
          <layout:container class="{customContainer}__container">
            <fc:slot name="content"/>
          </layout:container>
        </f:else>
        <f:else>
          <layout:container
                  width="{object.containerWidth}"
                  align="{object.containerPosition}"
                  offset="{object.containerOffset}">
            <fc:slot name="content"/>
          </layout:container>
        </f:else>
      </f:if>
    </section>
  </fc:renderer>
</fc:component>
