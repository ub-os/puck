<fc:component>
	<fc:param name="name" type="string" optional="1" default="l-modal"/>
	<fc:param name="id" type="string" optional="1"/>
	<fc:param name="width" type="integer" optional="1" default="6"/>
	<fc:param name="modalAttributes" type="array" optional="1" default="{}"/>
	<fc:param name="attributes" type="array" optional="1"/>
	<fc:renderer>

		{u:var(set:'defaultModalAttributes',value:'{duration:170}')}
		<dialog data-trait="modal"
				class="{name} {class} -width-{width}"
				id="{id}"
				data-modal="{defaultModalAttributes -> u:array(merge:modalAttributes) -> f:format.json()}"
				{attributes -> u:renderAttributes()}>
			<button class="{name}__close"
					data-autofocus
					data-handler="modal.hide"
					aria-label="{f:translate(key:'close')}">
				<icon:char icon="close"/>
			</button>

			<fc:slot name="content"/>
		</dialog>

	</fc:renderer>
</fc:component>
