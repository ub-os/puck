<fc:component>
	<fc:param name="name" type="string" optional="1" default="l-card"/>
	<fc:param name="width" type="integer" optional="1"/>
	<fc:param name="media" type="array" optional="1"/>
	<fc:param name="mediaSize" type="string" optional="1" default="cover"/>
	<fc:param name="mediaWidth" type="integer" optional="1" default=""/>
	<fc:param name="mediaLayout" type="string" optional="1" default="above"/>
	<fc:param name="cropVariant" type="string" optional="1" default="default"/>
	<fc:param name="attributes" type="array" optional="1"/>
	<fc:renderer>

		{u:var(set:'bemMod', value: {
		layout: mediaLayout,
		width: width,
		media-size: mediaSize,
		media-width: mediaWidth}
		)}
		<div class="{u:bem(mod:bemMod)} {class} {f:if(condition:media.0,then:'-media')}"
			 {attributes -> u:renderAttributes()}>
			<div class="{u:bem(el:'content', mod:bemMod)}">
				<fc:slot name="content"/>
			</div>
			<f:if condition="{itemWidth} > 4 || !{itemWidth}">
				<f:then>
					<f:variable name="calcWidth" value="{settings.template.gridWidth}"/>
				</f:then>
				<f:else if="{itemWidth} == 4">
					<f:variable name="calcWidth" value="{u:math(eval:'{settings.template.gridWidth}/3')}"/>
				</f:else>
				<f:else if="{itemWidth} == 3">
					<f:variable name="calcWidth" value="{u:math(eval:'{settings.template.gridWidth}/4')}"/>
				</f:else>
				<f:else>
					<f:variable name="calcWidth" value="{u:math(eval:'{settings.template.gridWidth}/5')}"/>
				</f:else>
			</f:if>
			<f:if condition="{media}">
				<element:media
					name="{name}"
					class="{u:bem(el:'figure', mod:bemMod)}"
					file="{media.0}"
					cropVariant="{cropVariant}"
					width="{calcWidth}"
					sources="{
                xs: {width: 430, cropVariant: cropVariant},
                m: {width: 900, cropVariant: cropVariant}
                }"
					breakpointSources="1"
					showTitle="{f:if(condition: '{mediaSize} == \'contain\'', then: '1', else: '0')}"
					showDesc="{f:if(condition: '{mediaSize} == \'contain\'', then: '1', else: '0')}"/>
			</f:if>
		</div>

	</fc:renderer>
</fc:component>
