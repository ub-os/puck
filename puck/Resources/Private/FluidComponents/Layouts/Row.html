
	<f:argument name="name" type="string" optional="1" default="l-row"/>
	<f:argument name="id" type="string" optional="1"/>
	<f:argument name="direction" type="string" optional="1" default="row"/>
	<f:argument name="justify" type="string" optional="1" default="center"/>
	<f:argument name="align" type="string" optional="1" default="flex-start"/>
	<f:argument name="itemWidth" type="integer" optional="1" default=""/>
	<f:argument name="flexGrow" type="integer" optional="1" default="0"/>
	<f:argument name="breakpoints" type="array" optional="1" default="{bp:'auto'}"/>
	<f:argument name="attributes" type="array" optional="1"/>


		<u:var set="bpClasses">
			<f:for each="{breakpoints}" key="bp" as="val">-{bp}-{val}</f:for>
		</u:var>
		<div class="{u:bem(
           raw:'{class} {bpClasses}',
           mod:{
              item-width: itemWidth,
              direction: direction,
              justify: justify,
              align: align,
              flex-grow: flexGrow
         })}"
			 {f:if(condition: id, then:
		'id="{id}"', else: '')}
		{attributes -> u:renderAttributes()}>
		<f:slot/>
		</div>
