
<f:argument name="name" type="string" optional="1" default="l-section"/>
<f:argument name="id" type="string" optional="1"/>
<f:argument name="record" type="mixed" optional="1"/>
<f:argument name="container" type="boolean" optional="1" default="1"/>
<f:argument name="containerName" type="string" optional="1" default=""/>
<f:argument name="attributes" type="array" optional="1"/>

<u:var set="sectionId" if="!{id} && {record.uid}" then="c{record.uid}" else="{id}"/>

<section class="{u:bem(
	   raw:class,
	   mod:{
		  background: record.frame_class,
		  layout: record.layout,
		  no-h2-spacing: record._remove_header_spacing
		  }
	 )}"
		 id="{sectionId}"
		 {attributes -> u:renderAttributes()}>
	<f:if condition="!{container}">
		<f:then>
			<f:slot/>
		</f:then>
		<f:else if="{containerName}">
			<layout:container class="{containerName}__container">
				<f:slot/>
			</layout:container>
		</f:else>
		<f:else>
			<layout:container
				width="{record.container_width}"
				align="{record.container_position}"
				offset="{record.container_offset}">
				<f:slot/>
			</layout:container>
		</f:else>
	</f:if>
</section>
