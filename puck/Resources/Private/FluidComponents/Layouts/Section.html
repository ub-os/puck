
<f:argument name="name" type="string" optional="1" default="l-section"/>
<f:argument name="id" type="string" optional="1"/>
<f:argument name="record" type="mixed" optional="1"/>
<f:argument name="top" type="string" optional="1" default="auto"/>
<f:argument name="bottom" type="string" optional="1" default="auto"/>
<f:argument name="container" type="boolean" optional="1" default="1"/>
<f:argument name="customContainer" type="string" optional="1" default=""/>
<f:argument name="attributes" type="array" optional="1"/>


<section class="{u:bem(
	   raw:class,
	   mod:{
		  background: record.frame_class,
		  layout: record.layout,
		  top: top,
		  bottom: bottom,
		  no-h2-spacing: record.remove_header_spacing
		  }
	 )}"
		 id="{id}"
		 {attributes -> u:renderAttributes()}>
	<f:if condition="!{container}">
		<f:then>
			<f:slot/>
		</f:then>
		<f:else if="{customContainer}">
			<layout:container class="{customContainer}__container">
				<f:slot/>
			</layout:container>
		</f:else>
		<f:else>
			<layout:container
				width="{record.container_width}"
				align="{record.container_position}"
				offset="{record.container_offset}">
				<f:slot/>
			</layout:container>
		</f:else>
	</f:if>
</section>
