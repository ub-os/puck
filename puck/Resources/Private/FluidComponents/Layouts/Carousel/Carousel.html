
<fc:component>
  <fc:param name="name" type="string" optional="1" default="l-carousel"/>
  <fc:param name="id" type="string"/>
  <fc:param name="options" type="array" optional="1" default="{prop:1}"/>
  <fc:param name="arrows" type="boolean" optional="1" default="1"/>
  <fc:param name="pagination" type="boolean" optional="1" default="0"/>
  <fc:param name="trackOverflow" type="string" optional="1" default="hidden"/>
  <fc:param name="align" type="string" optional="1" default="start"/>
  <fc:renderer>

    <f:variable name="defaultSplideOptions"
                value="{
                  pagination: pagination,
                  arrows: arrows,
                  classes: '{
                    arrows: \'{name}__arrows\',
                    arrow: \'{name}__arrow\',
                    prev: \'{name}__arrow--prev\',
                    next: \'{name}__arrow--next\',
                    pagination: \'{name}__pagination\',
                    page: \'{name}__page\'
                  }'
                }"/>

    <div class="{name} {class} splide"
         id="{id}"
         data-controller="carousel"
         data-carousel="{options -> f:format.json()}"
         data-carousel:splide-options="{puck:array.merge(a:defaultSplideOptions,b:options.splideOptions) -> f:format.json()}">
      <div class="{name}__track splide__track -overflow-{trackOverflow}">
        <ul class="{name}__list splide__list -align-{align}">
          <fc:slot name="content"/>
        </ul>
      </div>

      <f:if condition="{arrows}">
        <div class="{name}__controls {class} splide__arrows">
          <button class="{name}__controls__prev splide__arrow--prev" aria-controls="{id}">
            <icon:svg icon="arrow-left-regular"/>
          </button>
          <button class="{name}__controls__next splide__arrow--next" aria-controls="{id}">
            <icon:svg icon="arrow-right-regular"/>
          </button>
        </div>
      </f:if>

    </div>

  </fc:renderer>
</fc:component>
