<fc:component>
	<fc:param name="name" type="string" optional="1" default="l-row__item"/>
	<fc:param name="width" type="string" optional="1"/>
	<fc:param name="breakpoints" type="array" optional="1" default="{bp:'auto'}"/>
	<fc:param name="attributes" type="array" optional="1"/>
	<fc:renderer>

		<u:var set="bpClasses">
			<f:for each="{breakpoints}" key="bp" as="val">-{bp}-{val}</f:for>
		</u:var>
		<div class="{name} {class} -width-{width} {bpClasses}" {attributes -> u:renderAttributes()}>
			<fc:slot name="content"/>
		</div>

	</fc:renderer>
</fc:component>
