
	<f:argument name="name" type="string" optional="1" default="e-dropdown"/>
	<f:argument name="id" type="string"/>
	<f:argument name="label" type="string" optional="1" default=""/>
	<f:argument name="buttonContent" type="string" optional="1" default=""/>
	<f:argument name="outerContent" type="string" optional="1" default=""/>
	<f:argument name="showSelectedOption" type="boolean" optional="1" default="0"/>
	<f:argument name="attributes" type="array" optional="1"/>
	<f:argument name="dialogAttributes" type="array" optional="1" default="{duration:170}"/>


		<div id="{id}" class="{u:bem(mod:{showSelected:showSelectedOption})}" {attributes -> u:renderAttributes()}>
			<button class="{name}__button"
					data-target="dialog.control#{id}__dialog">
				{label}
				{buttonContent -> f:format.raw()}
				<icon:svg icon="angle-down-regular" class="{name}__button__icon"/>
			</button>
			{outerContent -> f:format.raw()}
			<dialog class="{name}__dialog"
					data-controller="dialog"
					data-dialog='{dialogAttributes -> f:format.json()}'
					data-dialog.out-target="#{id}"
					aria-label="{label}"
					id="{id}__dialog">
				<f:slot/>
			</dialog>
		</div>
