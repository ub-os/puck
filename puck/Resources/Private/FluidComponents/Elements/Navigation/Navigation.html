
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-navigation"/>
  <fc:param name="pages" type="string" optional="1" default="1"/>
  <fc:param name="processor" type="string" optional="1" default="tree"/>
  <fc:param name="depth" type="integer" optional="1" default="1"/>
  <fc:param name="menu" type="array" optional="1"/>
  <fc:param name="prependIcon" type="boolean" optional="1" default="0"/>
  <fc:param name="hideTitle" type="boolean" optional="1" default="0"/>
  <fc:param name="label" type="string" optional="1" default=""/>
  <fc:param name="attributes" type="array" optional="1"/>
  <fc:renderer>


    <f:if condition="!{menu}">
      <f:variable name="menu"
                  value="{u:menu(pages:pages, processor:processor, depth:depth)}"/>
    </f:if>

    <nav class="{name} {class}" aria-label="{label}">
      <ul class="{name}__list {f:if(condition: iconFromTitle, then: '-icons')}" {attributes -> u:renderAttributes()}>
        <element:navigation.items
                name="{name}"
                menu="{menu}"
                processor="{processor}"
                depth="{depth}"
                prependIcon="{prependIcon}"
                hideTitle="{hideTitle}"
        />
        <fc:slot name="content"/>
      </ul>
    </nav>
    
  </fc:renderer>

</fc:component>
