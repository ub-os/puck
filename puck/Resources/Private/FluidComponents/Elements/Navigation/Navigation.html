
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-navigation"/>
  <fc:param name="pages" type="string" optional="1" default="1"/>
  <fc:param name="processor" type="string" optional="1" default="tree"/>
  <fc:param name="depth" type="integer" optional="1" default="1"/>
  <fc:param name="menu" type="array" optional="1"/>
  <fc:param name="iconFromTitle" type="boolean" optional="1" default="0"/>
  <fc:param name="attributes" type="mixed" optional="1"/>
  <fc:renderer>

    <f:if condition="!{menu}">
      <f:variable name="menu"
                  value="{puck:data.menu(pages:pages, processor:processor, depth:depth)}"/>
    </f:if>

    <nav class="{name} {class}">
      <ul class="{name}__list {f:if(condition: iconFromTitle, then: '-icons')}" {attributes -> puck:attributes()}>
        <element:navigation.items name="{name}"
                                  menu="{menu}"
                                  processor="{processor}"
                                  depth="{depth}"
                                  iconFromTitle="{iconFromTitle}"/>
        <f:format.raw>
          {content}
        </f:format.raw>
      </ul>
      <f:if condition="{processor} == 'breadcrumbs'">
        <schema:type.breadcrumbList>
          <f:for each="{menu}" as="item" iteration="i">
            <schema:type.listItem
                    -as="itemListElement"
                    position="{i.cycle}"
                    name="{item.nav_title}"
                    item="{f:uri.page(pageUid: '{item.uid}', absolute: '1')}"
            />
          </f:for>
        </schema:type.breadcrumbList>
      </f:if>
    </nav>
    
  </fc:renderer>

</fc:component>
