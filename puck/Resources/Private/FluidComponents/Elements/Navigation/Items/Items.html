
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-navigation"/>
  <fc:param name="pages" type="string" optional="1" default="1"/>
  <fc:param name="processor" type="string" optional="1" default="tree"/>
  <fc:param name="depth" type="integer" optional="1" default="1"/>
  <fc:param name="menu" type="array" optional="1"/>
  <fc:param name="iconFromTitle" type="boolean" optional="1" default="0"/>
  <fc:renderer>

    {u:var(set:'menu', if:'{menu}', then:menu, else:'{puck:data.menu(pages:pages, processor:processor, depth:depth)}')}

    <f:for each="{menu}" as="item" iteration="i">
      <li class="{name}__item {item.class}">
        <f:if condition="{i.index} > 0 && {processor} == 'breadcrumbs'">❯</f:if>
        <f:if condition="{i.isLast} && {processor} == 'breadcrumbs'">
          <f:then>
                  <span class="{name}__link">
                    <f:format.raw>{item.nav_title}</f:format.raw>
                  </span>
          </f:then>
          <f:else if="{processor} == 'language'">
            <f:variable name="mods"
                        value="{active-lang: item.isActiveLanguage}"/>
            <f:link.typolink parameter="{item.uid}"
                             language="{item.language.languageId}"
                             class="{name}__link {mods -> puck:modClass()}"
                             absolute="1">
              {item.language.title}
            </f:link.typolink>
          </f:else>
          <f:else>
            <f:variable name="mods"
                        value="{rootline: item.isInRootLine,
                                current: item.isCurrentPage,
                                has-subpages: item.hasSubpages}"/>
            <f:link.typolink parameter="{item.uid}"
                             class="{name}__link {mods -> puck:modClass()}"
                             absolute="1"
                             additionalAttributes="{aria-label: item.nav_title}">
              <f:if condition="{i.index} == 0 && {processor} == 'breadcrumbs'">
                <icon:svg icon="home" class="{name}__icon"/>
              </f:if>
              <f:if condition="{iconFromTitle}">
                <f:then>
                  <icon:svg icon="{item.nav_title -> f:format.case(mode:'lower')}" class="{name}__icon"/>
                </f:then>
                <f:else>
                  <f:format.raw>{item.nav_title}</f:format.raw>
                </f:else>
              </f:if>
            </f:link.typolink>
          </f:else>
        </f:if>
        <f:if condition="{item.hasSubpages}">
          <f:variable name="subName">{name}__sub</f:variable>
          <ul class="{subName}__list">
            <f:for each="{item.subpages}" as="item">
              <f:variable name="mods"
                          value="{rootline: item.isInRootLine,
                                  current: item.isCurrentPage,
                                  has-subpages: item.hasSubpages}"/>
              <li class="{subName}__item">
                <f:link.typolink
                        parameter="{item.link}"
                        absolute="1"
                        class="{subName}__link {mods -> puck:modClass()}">
                  <f:format.raw>{item.nav_title}</f:format.raw>
                </f:link.typolink>
            </f:for>
          </ul>
        </f:if>
      </li>
    </f:for>

    
  </fc:renderer>

</fc:component>
