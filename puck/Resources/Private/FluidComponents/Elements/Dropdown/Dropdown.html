
<fc:component>
    <fc:param name="name" type="string" optional="1" default="e-dropdown"/>
    <fc:param name="id" type="string"/>
    <fc:param name="label" type="string" optional="1" default=""/>
    <fc:param name="buttonContent" type="Slot" optional="1" default=""/>
    <fc:param name="outerContent" type="Slot" optional="1" default=""/>
    <fc:param name="toggleableProps" type="array" optional="1" default="{outClickOff: 1}"/>
    <fc:param name="showSelectedOption" type="boolean" optional="1" default="0"/>
    <fc:param name="attributes" type="mixed" optional="1"/>
    <fc:renderer>

        <div class="{name} {puck:modClass(mods:'{showSelected:showSelectedOption}')}" {attributes -> puck:attributes()}>
            <button class="{name}__button"
                    data-action="click->toggle@toggleable#{id}"
                    data-target="toggle@toggleable#{id}">
                {label}
                <fc:slot name="buttonContent"/>
                <icon:svg icon="angle-down-regular" class="{name}__button__icon"/>
            </button>
            <fc:slot name="outerContent"/>
            <div class="{name}__box" data-controller="toggleable" data-toggleable='{toggleableProps -> f:format.json()}' id="{id}">
                <fc:slot name="content"/>
            </div>
        </div>

    </fc:renderer>
</fc:component>
