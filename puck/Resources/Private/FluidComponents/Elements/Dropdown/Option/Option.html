
<fc:component>
    <fc:param name="name" type="string" optional="1" default="e-dropdown"/>
    <fc:param name="attributes" type="array" optional="1"/>
    <fc:param name="href" type="string" optional="1"/>
    <fc:renderer>

        <element:tag class="{name}__option {class}"
                     is="{f:if(condition:href,then:'a',else:'button')}"
                     attributes="{attributes -> u:array(if:'{href}', merge:{href:href})}">
            <fc:slot name="content"/>
        </element:tag>

    </fc:renderer>
</fc:component>
