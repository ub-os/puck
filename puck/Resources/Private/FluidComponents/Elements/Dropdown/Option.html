
<f:argument name="name" type="string" optional="1" default="e-dropdown__option"/>
<f:argument name="attributes" type="array" optional="1"/>
<f:argument name="href" type="string" optional="1"/>


<element:tag class="{name} {class}"
			 is="{f:if(condition:href,then:'a',else:'button')}"
			 attributes="{attributes -> u:array(if:'{href}', merge:{href:href})}">
	<f:slot/>
</element:tag>
