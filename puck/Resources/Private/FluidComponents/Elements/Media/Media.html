
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-media"/>
  <fc:param name="file" type="SMS\FluidComponents\Domain\Model\File" optional="1"/>
  <fc:param name="files" type="array" optional="1"/>
  <fc:param name="width" type="integer" optional="1"/>
  <fc:param name="sources" type="array" optional="1"/>
  <fc:param name="cropVariant" type="string" optional="1" default="default"/>
  <fc:param name="webp" type="boolean" optional="1" default="1"/>
  <fc:param name="retina" type="boolean" optional="1" default="1"/>
  <fc:param name="loading" type="string" optional="1" default="lazy"/>
  <fc:param name="additionalConfig" type="array" optional="1" default="{controls:1,autoplay:0,loop:0}"/>
  <fc:param name="backgroundImg" type="boolean" optional="1" default="0"/>
  <fc:param name="reserveHeight" type="string" optional="1"/>
  <fc:param name="usePlayerComponentForLocalVideoFiles" type="boolean" optional="1" default="1"/>
  <fc:param name="showTitle" type="boolean" optional="1" default="0"/>
  <fc:param name="showDesc" type="boolean" optional="1" default="0"/>
  <fc:renderer>

    <f:variable name="filesP" value="{f:if(condition: file, then: '{0: file}', else: files)}"/>
    <f:if condition="{filesP}">
      <f:for each="{filesP}" as="file" iteration="i">
        <f:if condition="{file}">
          <f:variable name="fileReference" value="{file}"/>
          <f:if condition="{file.file}">
            <f:variable name="fileReference" value="{file.file}"/>
          </f:if>
          <f:if condition="{file.file.originalResource}">
            <f:variable name="fileReference" value="{file.file.originalResource}"/>
          </f:if>
          <figure class="{name}__figure {class}">
            <f:if condition="{fileReference.link}">
              <f:then>
                <f:link.typolink parameter="{fileReference.link}" class="{name}__file__link">
                  <element:media.item
                          file="{fileReference}"
                          name="{name}"
                          cropVariant="{cropVariant}"
                          width="{width}"
                          retina="{retina}"
                          webp="{webp}"
                          backgroundImg="{backgroundImg}"
                          loading="{loading}"
                          reserveHeight="{reserveHeight}"
                          sources="{sources}"
                          additionalConfig="{additionalConfig}"
                          usePlayerComponentForLocalVideoFiles="{usePlayerComponentForLocalVideoFiles}"
                  />
                </f:link.typolink>
              </f:then>
              <f:else>
                <element:media.item
                        file="{fileReference}"
                        name="{name}"
                        cropVariant="{cropVariant}"
                        width="{width}"
                        retina="{retina}"
                        webp="{webp}"
                        backgroundImg="{backgroundImg}"
                        loading="{loading}"
                        reserveHeight="{reserveHeight}"
                        sources="{sources}"
                        additionalConfig="{additionalConfig}"
                        usePlayerComponentForLocalVideoFiles="{usePlayerComponentForLocalVideoFiles}"
                />
              </f:else>
            </f:if>
            <f:if condition="{showTitle} && {fileReference.title}">
              <div class="{name}__file__title">{fileReference.title}</div>
            </f:if>
            <f:if condition="{showDesc} && {fileReference.description}">
              <figcaption class="{name}__file__desc">{fileReference.description}</figcaption>
            </f:if>
          </figure>
        </f:if>
      </f:for>
    </f:if>

  </fc:renderer>
</fc:component>
