<fc:component>
    <fc:param default="e-media-player" name="name" optional="1" type="string"/>
    <fc:param name="file" type="TYPO3\CMS\Core\Resource\FileReference"/>
    <fc:param name="width" optional="1" type="integer"/>
    <fc:param default="1" name="posterWebp" optional="1" type="boolean"/>
    <fc:param default="1" name="posterRetina" optional="1" type="boolean"/>
    <fc:param default="1" name="loadOnClick" optional="1" type="boolean"/>
    <fc:param default="1" name="openInModal" optional="1" type="boolean"/>
    <fc:param default="{0:0}" name="props" optional="1" type="array"/>
    <fc:renderer>

        <f:variable name="id">{file.name}-{puck:math.random(min:1000, max:9999)}</f:variable>
        <f:variable name="playerId">{file.name}-{puck:math.random(min:1000, max:9999)}-player</f:variable>

        <f:variable name="localPoster" value="{puck:utility.fileExists(src:'fileadmin{file.identifier}.jpg')}"/>
        <f:if condition="{localPoster}">
            <f:then>
                <f:variable name="poster" value="{localPoster}"/>
            </f:then>
            <f:else>
                <f:variable name="poster"
                            value="{puck:utility.getOnlineMediaPoster(service:file.extension, id:file.contents)}"/>
            </f:else>
        </f:if>

        <f:if condition="{file.extension} === 'youtube' || {file.extension} === 'vimeo'">
            <f:variable name="embedId" value="{file.contents}"/>
        </f:if>
        <f:variable name="props"
                    value="{puck:array.merge(
                    a:props,
                    b:{
                        filePath:file.publicUrl,
                        provider:file.extension,
                        embedId:embedId,
                        poster:poster,
                    }
                    )}"/>

        <div class="{name}">
            <button class="{name}__button"
                    data-action="click->toggle@modal#{id}-modal click->addPlayerEl@media-player#{id}"
                    aria-controls="{id}-modal"
                    aria-label="{f:translate(key:'play-video',extensionName:'puck')}"></button>

            <f:comment>
                <div class="{name}__poster">
                    <f:if condition="{localPoster}">
                        <f:then>
                            <element:picture
                                    loading="lazy"
                                    name="{name}"
                                    retina="{posterRetina}"
                                    sources="{
                                    xs: {width: width},
                                    0: {width: 450}
                                    }"
                                    src="{poster}"
                                    webp="{posterWebp}"
                                    width="{width}"/>
                        </f:then>
                        <f:else>
                            <picture>
                                <img alt="{file.alternative}"
                                     class="{name}__image"
                                     loading="lazy"
                                     src="{poster}">
                            </picture>
                        </f:else>
                    </f:if>
                </div>
            </f:comment>
            <icon:svg class="{name}__icon" icon="circle-play-duotone"/>
            <f:if condition="{openInModal}">
                <f:then>
                    <layout:modal id="{id}-modal" width="12">
                        <div id="{id}"
                             class="{name}__modal__frame"
                             data-controller="media-player"
                             data-media-player="{props -> f:format.json()}">
                        </div>
                    </layout:modal>
                </f:then>
                <f:else>
                    <div class="{name}__frame" id="{id}"
                         data-controller="media-player"
                         data-media-player="{props -> f:format.json()}">
                    </div>
                </f:else>
            </f:if>
        </div>

    </fc:renderer>
</fc:component>
