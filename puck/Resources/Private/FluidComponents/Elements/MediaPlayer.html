
<f:argument default="e-media-player" name="name" optional="1" type="string"/>
<f:argument name="file" type="TYPO3\CMS\Core\Resource\FileReference"/>
<f:argument name="width" optional="1" type="integer"/>
<f:argument name="posterSources" optional="1" type="array"/>
<f:argument default="1" name="posterWebp" optional="1" type="boolean"/>
<f:argument default="1" name="posterRetina" optional="1" type="boolean"/>
<f:argument default="1" name="loadOnClick" optional="1" type="boolean"/>
<f:argument default="1" name="openInModal" optional="1" type="boolean"/>
<f:argument default="{0:0}" name="playerAttributes" optional="1" type="array"/>

<u:id set="id" suffix="{file.name}"/>
<u:file get="{file.properties.storage}:{file.identifier}.jpg" set="localPoster"/>
<u:var if="{file.extension} === 'youtube' || {file.extension} === 'vimeo'" then="{file.contents}" else="" set="embedId"/>
<u:array merge="{src:file.publicUrl, provider:file.extension, embedId:embedId}" set="playerAttributes">{playerAttributes}</u:array>

<u:var set="playerContent">
	<div
		id="{id}"
		class="{name}__modal__frame"
		data-controller="media-player"
		data-media-player='{playerAttributes -> f:format.json()}'>
	</div>
</u:var>

<div class="{name}">
	<button class="{name}__button"
			data-action="modal.toggle#{id}-modal media-player.load#{id}"
			aria-controls="{id}-modal"
			aria-label="{f:translate(key:'play-video',extensionName:'puck')}{f:if(condition:'{file.title}', then:': {file.title}')}">
	</button>

	<div class="{name}__poster">
		<f:if condition="{localPoster}">
			<f:then>
				<u:picture
					class="{name}__image"
					loading="lazy"
					retina="{posterRetina}"
					sources="{posterSources}"
					image="{localPoster}"
					webp="{posterWebp}"
					width="{width}"
					sourceMaxWidth="{width}"
				/>
			</f:then>
			<f:else if="{file.extension} === 'youtube' || {file.extension} === 'vimeo'">
				<picture>
					<f:image
						alt="{file.alternative}"
						class="{name}__image"
						loading="lazy"
						width="{width}"
						image="{file}"
					/>
				</picture>
			</f:else>
		</f:if>
	</div>
	<div class="{name}__icon">
		<icon:svg icon="play-solid"/>
	</div>
	<f:if condition="{openInModal}">
		<f:then>
			<layout:modal id="{id}-modal" width="12">
				{playerContent -> f:format.raw()}
			</layout:modal>
		</f:then>
		<f:else>{playerContent -> f:format.raw()}</f:else>
	</f:if>
</div>
