
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-plugin-filter"/>
  <fc:param name="filter" type="array"/>
  <fc:param name="actionLink" type="array"/>
    <fc:param name="fetchConfig" type="array" optional="1"/>
  <fc:renderer>

    <f:if condition="{filter.categories}">
      <p class="{name} e-button-group -gutter-0">
        <f:for each="{filter.categories}" as="category">

            <f:variable name="arguments" value="{puck:array.merge(a:actionLink.arguments,b:'{categoryList:category.uid}')}" />
            <f:if condition="{category.uid} == {filter.current}">
                <f:variable name="arguments" value="{puck:array.unset(array:actionLink.arguments,key:'categoryList')}" />
            </f:if>
            <f:if condition="{fetchConfig.rootNodeId} && {fetchConfig.pageType} && {fetchConfig.arguments}">
                <f:variable name="fetchLink"
                            value="{f:uri.action(
                              action:actionLink.action,
                              controller:actionLink.controller,
                              extensionName:actionLink.extensionName,
                              pageUid:actionLink.pageUid,
                              arguments:'{puck:array.merge(a:arguments,b:fetchConfig.arguments)}',
                              pageType:fetchConfig.pageType
                )}"/>
                <f:variable name="options"
                            value="{
                                url:fetchLink,
                                mode:'replace',
                                contentId:fetchConfig.rootNodeId,
                                scrollToContent:1
                }" />
            </f:if>
            <f:link.action action="{actionLink.action}"
                           controller="{actionLink.controller}"
                           extensionName="{actionLink.extensionName}"
                           section="{actionLink.section}"
                           pageUid="{actionLink.pageUid}"
                           arguments="{arguments}"
                           additionalAttributes="{data-fetch-link:'{options -> f:format.json()}'}"
                           class="{name}__link e-button-primary {f:if(condition:'{category.uid} == {filter.current}',then:'--active')}">
                {category.title}
            </f:link.action>

        </f:for>
      </p>
    </f:if>

  </fc:renderer>
</fc:component>
