<fc:component>
    <fc:param default="e-plugin-load-more-button" name="name" optional="1" type="string"/>
    <fc:param name="pagination" type="array"/>
    <fc:param name="actionLink" type="array"/>
    <fc:param name="fetchConfig" type="array"/>
    <fc:renderer>

        <f:if condition="{fetchConfig.listNodeId} && {fetchConfig.pageType} && {fetchConfig.arguments}">
            <f:variable name="arguments" value="{puck:array.merge(a:actionLink.arguments,b:'{page:pagination.next}')}" />
            <div class="{name}__wrap" id="c{object.uid}-load-more-button">
                <f:if condition="{pagination.next}">
                    <f:then>
                        <f:variable name="fetchLink" value="{f:uri.action(
                                  action:actionLink.action,
                                  controller:actionLink.controller,
                                  extensionName:actionLink.extensionName,
                                  pageUid:actionLink.pageUid,
                                  arguments:'{puck:array.merge(a:arguments,b:fetchConfig.arguments)}',
                                  pageType:16500001
                                )}"/>
                        <f:variable name="options" value="{
                            url:fetchLink,
                            mode:'append',
                            contentId:fetchConfig.listNodeId
                        }" />
                        <button class="{name}__button e-button-primary"
                                id="{fetchConfig.listNodeId}-load-more-button"
                                data-fetch-link="{options -> f:format.json()}">
                            <icon:svg icon="plus-regular"/>
                        </button>
                    </f:then>
                    <f:else>
                        <button class="e-button-primary -disabled"
                                id="{fetchConfig.listNodeId}-load-more-button"
                                style="display: none"
                        >
                            <icon:svg icon="plus-regular"/>
                        </button>
                    </f:else>
                </f:if>
            </div>
        </f:if>


    </fc:renderer>
</fc:component>
