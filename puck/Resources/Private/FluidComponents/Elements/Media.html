
<f:argument name="name" type="string" optional="1" default="e-media"/>
<f:argument name="file" type="mixed" optional="1"/>
<f:argument name="files" type="array" optional="1"/>
<f:argument name="width" type="integer" optional="1"/>
<f:argument name="sources" type="array" optional="1"/>
<f:argument name="breakpointSources" type="boolean" optional="1" default="0"/>
<f:argument name="cropVariant" type="string" optional="1" default="default"/>
<f:argument name="webp" type="boolean" optional="1" default="0"/>
<f:argument name="avif" type="boolean" optional="1" default="0"/>
<f:argument name="retina" type="boolean" optional="1" default="1"/>
<f:argument name="retinaOnly" type="boolean" optional="1" default="1"/>
<f:argument name="loading" type="string" optional="1" default="lazy"/>
<f:argument name="additionalConfig" type="array" optional="1" default="{controls:1,autoplay:0,loop:0}"/>
<f:argument name="backgroundImg" type="boolean" optional="1" default="0"/>
<f:argument name="reserveHeight" type="string" optional="1"/>
<f:argument name="inlineSvg" type="boolean" optional="1" default="0"/>
<f:argument name="usePlayerComponentForLocalVideoFiles" type="boolean" optional="1" default="1"/>
<f:argument name="showTitle" type="boolean" optional="1" default="0"/>
<f:argument name="showDesc" type="boolean" optional="1" default="0"/>


<u:var set="files" if="{file}" then="{0:file}" else="{files}"/>

<f:if condition="{files}">
	<f:for each="{files}" as="fileItem" iteration="i">

		{u:file(get:fileItem, set:'file')}

		<div class="{name}__figure {class}"
			 {f:if(condition:'{showDesc} && {file.description}',then:'role="figure"')}>
		<f:if condition="{file.link}">
			<f:then>
				<f:link.typolink parameter="{file.link}" class="{name}__file__link">
					<f:render section="MediaContent" arguments="{_all}"/>
				</f:link.typolink>
			</f:then>
			<f:else>
				<f:render section="MediaContent" arguments="{_all}"/>
			</f:else>
		</f:if>

		<f:if condition="{showTitle} && {file.title}">
			<div class="{name}__file__title">{file.title}</div>
		</f:if>

		<f:if condition="{showDesc} && {file.description}">
			<div class="{name}__file__desc" role="caption">{file.description}</div>
		</f:if>
		</div>
	</f:for>
</f:if>

<f:section name="MediaContent">
	<f:if condition="{file.extension} == 'jpeg' || {file.extension} == 'jpg' || {file.extension} == 'png' || {file.extension} == 'gif' || {file.extension} == 'webp' || ({file.extension} == 'svg' && !{inlineSvg})}">
		<f:then>
			<u:picture
				image="{file}"
				className="{name}"
				class="{name}__file"
				cropVariant="{cropVariant}"
				width="{width}"
				retina="{retina}"
				retinaOnly="{retinaOnly}"
				webp="{webp}"
				avif="{avif}"
				backgroundImage="{backgroundImg}"
				loading="{loading}"
				reserveHeight="{reserveHeight}"
				breakpointSources="{breakpointSources}"
				sources="{sources}"
				sourceMaxWidth="{width}"
			/>
		</f:then>
		<f:else if="{file.extension} == 'svg'">
			<f:if condition="{inlineSvg}">
				<f:then>
					<div class="{name}__file {name}__{file.extension}">
						<u:inlineSvg file="{file}"/>
					</div>
				</f:then>
				<f:else>
					<f:image image="{file}"
							 class="{name}__image {name}__file"
							 width="{width}"
							 absolute="true"
							 additionalAttributes="{additionalAttributes}"
							 alt="{file.alternative}"/>
				</f:else>
			</f:if>
		</f:else>
		<f:else
			if="{file.extension} == 'youtube' || {file.extension} == 'vimeo' || ({usePlayerComponentForLocalVideoFiles} && ({file.extension} == 'mp4' || {file.extension} == 'webm'))">
			<div class="{name}__file {name}__{file.extension}">
				<element:mediaPlayer file="{file}"
									 width="{width}"
									 posterWebp="{webp}"
									 posterSources="{sources}"
									 posterRetina="{retina}"/>
			</div>
		</f:else>
		<f:else if="!{file.extension}">
			<f:image src="{file}"
					 width="{width}"
					 class="{name}__file"
					 alt="{file.alternative}"/>
		</f:else>
		<f:else>
			<f:media file="{file}"
					 width="{width}"
					 additionalConfig="{autoplay:additionalConfig.autoplay, controls:additionalConfig.controls, loop:additionalConfig.loop, playsinline:additionalConfig.autoplay, muted:additionalConfig.autoplay}"
					 class="{name}__{file.extension} {name}__file"
					 alt="{file.alternative}"/>
		</f:else>
	</f:if>
</f:section>
