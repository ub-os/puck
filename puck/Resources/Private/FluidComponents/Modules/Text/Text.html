
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-text"/>
  <fc:param name="record" type="mixed"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap {f:if(condition: '!{record.bodytext}', then: '-headline-only')} {class}"
            object="{record}"
            id="c{record.uid}">
        <element:moduleHeader object="{record}"/>
        <element:richText text="{record.bodytext}"/>
        <fc:slot name="content"/>
    </layout:section>

  </fc:renderer>
</fc:component>
