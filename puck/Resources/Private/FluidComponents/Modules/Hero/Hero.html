
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-hero"/>
  <fc:param name="record" type="mixed"/>
    <fc:renderer>

    <layout:section
            class="{name}__wrap {f:if(condition: '!{record.bodytext} && !{record.assets}', then: '-headline-only')} -layout-{record.layout}"
            id="c{record.uid}">
        <div class="{name}">
            <div class="{name}__text">
                <f:if condition="{record.subheader}">
                    <p class="{name}__topline">
                        {record.subheader -> f:format.raw()}
                    </p>
                </f:if>
                <h1 class="{name}__headline">{record.header -> f:format.raw()}</h1>
                <element:richText class="{name}__bodytext" text="{record.bodytext}"/>
            </div>
            <f:if condition="{record.assets}">
                <element:media
                        file="{record.assets.0}"
                        cropVariant="2:1"
                        name="{name}"
                        width="{settings.template.gridWidth}"
                        loading="auto"
                        sources="{
                        xs: {width: 430, cropVariant: '3:2'},
                        m: {width: 900, cropVariant: '2:1'}
                    }"/>
            </f:if>
        </div>
    </layout:section>

  </fc:renderer>
</fc:component>
