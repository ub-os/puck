<fc:component>
    <fc:param name="name" type="string" optional="1" default="m-hero-carousel"/>
    <fc:param name="object" type="mixed"/>
    <fc:param name="children" type="array" optional="1"/>
    <fc:renderer>

        <layout:section
                class="{name}__wrap"
                object="{object}"
                top="none"
                id="c{object.uid}">
            <layout:carousel class="{name}" id="c{object.uid}-splide" trackOverflow="visible" pagination="1" arrows="0">
                <f:for each="{children}" as="child">
                    {child.renderedContent -> f:format.raw()}
                </f:for>
            </layout:carousel>
        </layout:section>

    </fc:renderer>
</fc:component>
