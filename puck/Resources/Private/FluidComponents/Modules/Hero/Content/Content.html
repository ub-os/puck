
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-hero-content"/>
  <fc:param name="object" type="mixed"/>
    <fc:renderer>

    <layout:section
        class="{name}__wrap {f:if(condition: '!{object.bodytext} && !{object.assets}', then: '-headline-only')} -layout-{object.layout}"
        top="none"
        id="c{object.uid}">
        <f:if condition="{object.assets}">
            <element:media
                    file="{object.assets.0}"
                    cropVariant="2:1"
                    name="{name}"
                    width="{settings.gridWidth}"
                    loading="auto"
                    showDesc="1"
                    sources="{
                        s: {width: 1300, cropVariant: '2:1'},
                        xs: {width: 600, cropVariant: '3:2'},
                        0: {width: 450, cropVariant: '3:2'}
                    }"/>
        </f:if>
        <div class="{name}__text">
            <f:if condition="{object.subheader}">
                <p class="{name}__topline">
                    <f:format.raw>{object.subheader}</f:format.raw>
                </p>
            </f:if>
            <h1 class="{name}__headline">{object.header}</h1>
            <element:text.rich class="{name}__bodytext" text="{object.bodytext}"/>
        </div>
    </layout:section>
  </fc:renderer>
</fc:component>
