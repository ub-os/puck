
	<f:argument name="name" type="string" optional="1" default="m-container"/>
	<f:argument name="record" type="mixed"/>
	<f:argument name="children_600" type="array" optional="1"/>


		<layout:section
			class="{name}__wrap"
			record="{record}"
			id="c{record.uid}">
			<element:moduleHeader record="{record}"/>
			<element:richText text="{record.bodytext}" class="{name}__bodytext"/>

			<f:for each="{children_600}" as="child">
				{child.renderedContent -> f:format.raw()}
			</f:for>

		</layout:section>
