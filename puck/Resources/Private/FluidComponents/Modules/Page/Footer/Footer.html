
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-page-footer"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="contentElements" type="string"/>
  <fc:renderer>

    <footer class="{name}">
      <layout:section
              class="{name}-navigation__wrap -background-dark-1"
              top="none"
              bottom="none">
        <div class="{name}__navigations">
          <element:navigation name="{name}-navigation" pages="{settings.navUid.footer}" class="">
            <f:comment>
              <li class="{name}-navigation__item">
                <button class="{name}-navigation__link" onclick="UC_UI.showSecondLayer();">Cookies</button>
              </li>
            </f:comment>
          </element:navigation>
          <element:navigation name="{name}-navigation" pages="{settings.navUid.social}" class="-social"  iconFromTitle="1"/>
        </div>
      </layout:section>
      {contentElements -> f:format.raw()}
    </footer>

  </fc:renderer>
</fc:component>
