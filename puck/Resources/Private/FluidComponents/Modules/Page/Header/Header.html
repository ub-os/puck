
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-page-header"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="context" type="array"/>
  <fc:renderer>

    <header class="{name}" id="header"
            data-controller="page-header"
            data-page-header:scroll-tops="{f:format.json(value:{0:1,800:25})}"
            data-scroll-sensitive:scroll-top="25">
      <div class="{name}__background"></div>
      <div class="{name}__container">
        <f:link.typolink
                class="{name}__anchor"
                absolute="1"
                parameter="{context.site.rootPageId}"
                additionalAttributes="{aria-label: 'home'}">
          <icon:svg icon="website-logo" class="{name}__logo"/>
        </f:link.typolink>
        <div class="{name}-menu__wrap"
             id="main-nav"
             data-controller="main-nav"
             data-main-nav:breakpoint="1150"
             data-main-nav:init-class="m-page-header-menu"
             data-main-nav:modal-class="m-page-sidebar-menu"
             data-modal:duration="300"
             data-modal:append-to="">
          <div class="{name}-menu__header">
            <button class="{name}-menu__close"
                    data-action="click->toggle@modal"
                    aria-controls="main-nav"
                    aria-label="{f:translate(key:'close')}">
              <icon:char icon="close" />
            </button>
          </div>
          <f:comment>
              // small navigation with search link that opens modal
            <element:navigation name="{name}-menu" class="-small" pages="{settings.navUid.meta}">
              <f:if condition="{data.uid} != 18">
                <li class="{name}-menu__item">
                  <a href="#" class="{name}-menu__link" aria-controls="header-search-modal">
                    <f:translate extensionName="puck" key="search"/>
                  </a>
                </li>
              </f:if>
            </element:navigation>
          </f:comment>
          <element:navigation name="{name}-menu" class="" pages="{settings.navUid.main}"/>
        </div>

        <div class="{name}-menu__backdrop"></div>
        <div class="{name}__burger">
          <element:control.burger/>
        </div>
      </div>
    </header>
    <f:comment>
      <f:variable name="searchName" value="m-form-indexedsearch"/>
      <layout:modal id="header-search-modal"
                    class="{searchName}__modal">
        <f:form     pluginName="Pi2"
                    extensionName="indexedsearch"
                    pageUid="{settings.search.pid}"
                    controller="Search">
          <div class="{searchName}__wrap">
            <f:form.textfield
                    id="main-nav-search-input"
                    class="{searchName}__input"
                    placeholder="Suchbegriff"
                    name="search[sword]"/>
             
            <f:form.submit name="search[submitButton]"
                           class="{searchName}__submit"
                           value="{f:translate(extensionName:'puck',key:'search')}"/>
          </div>
        </f:form>
      </layout:modal>
    </f:comment>
  </fc:renderer>
</fc:component>
