<fc:component>
  <fc:param name="object" type="mixed"/>
  <fc:param name="contentElements" type="string"/>
  <fc:param name="name" type="string" optional="1" default="m-page-main"/>
  <fc:renderer>

    <main class="{name}" id="page-main">
      <f:if condition="{object.doktype} === 71">
        <module:hero.content object="{
            header:object.pagePersons.0.name,
            bodytext:object.pagePersons.0.bodytext,
            assets:object.pagePerson.0.assets}"/>
      </f:if>
      <f:if condition="{object.doktype} === 60">
        <module:hero.content object="{
            header:object.navTitle,
            subheader: '{object.postDate -> f:format.date(format: \'%d. %B %Y\')}'
            }"/>
      </f:if>
      <f:format.raw>{contentElements}</f:format.raw>
    </main>
    <div class="l-modal__backdrop"></div>

  </fc:renderer>
</fc:component>
