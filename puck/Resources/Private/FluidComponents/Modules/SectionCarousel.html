
	<f:argument name="name" type="string" optional="1" default="m-section-carousel"/>
	<f:argument name="record" type="mixed"/>
	<f:argument name="children600" type="array" optional="1"/>
	<f:argument name="options" type="array" optional="1"/>


		<layout:carousel id="c{record.uid}"
						 class="{name}"
						 arrows="{options.carousel.arrows}"
						 pagination="{options.carousel.pagination}"
						 trackOverflow="{options.carousel.trackOverflow}"
						 carouselAttributes="{splideOptions: options.splide}">
			<f:for each="{children600}" as="child">
				<div class="{name}__slide splide__slide">
					{child.renderedContent -> f:format.raw()}
				</div>
			</f:for>
		</layout:carousel>
