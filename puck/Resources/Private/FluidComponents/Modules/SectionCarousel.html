
	<f:argument name="name" type="string" optional="1" default="m-section-carousel"/>
	<f:argument name="record" type="mixed"/>
	<f:argument name="children_300" type="array" optional="1"/>

	<layout:carousel id="c{record.uid}"
					 class="{name}"
					 arrows="{record.options.carousel.arrows}"
					 pagination="{record.options.carousel.pagination}"
					 trackOverflow="{record.options.carousel.trackOverflow}"
					 carouselAttributes="{splideOptions: record.options.splide}">
		<f:for each="{children_300}" as="child">
			<div class="{name}__slide splide__slide">
				{child.renderedContent -> f:format.raw()}
			</div>
		</f:for>
	</layout:carousel>
