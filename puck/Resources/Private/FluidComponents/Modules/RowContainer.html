
	<f:argument name="name" type="string" optional="1" default="m-row-container"/>
	<f:argument name="record" type="mixed"/>
	<f:argument name="children600" type="array" optional="1"/>
	<f:argument name="options" type="array" optional="1"/>

	<layout:section
		class="{name}__wrap"
		record="{record}"
		id="c{record.uid}">
		<element:moduleHeader record="{record}"/>
		<element:richText text="{record.bodytext}" class="{name}__bodytext"/>

		<f:switch expression="{record.layout}">
			<f:case value="carousel">
				<layout:carousel id="c{record.uid}-splide" class="{name}__carousel"
								 align="{record.row_align}"
								 arrows="{options.carousel.arrows}"
								 pagination="{options.carousel.pagination}"
								 trackOverflow="{options.carousel.trackOverflow}"
								 carouselAttributes="{splideOptions: options.splide}">
					<f:for each="{children600}" as="child">
						<layout:row.item
							class="splide__slide {name}__item {f:if(condition:'{record.row_align} === \'stretch\'', then:'-stretch-content')}"
							width="{child.container_width}">
							{child.renderedContent -> f:format.raw()}
						</layout:row.item>
					</f:for>
				</layout:carousel>
			</f:case>

			<f:defaultCase>
				<layout:row justify="{record.row_justify}" align="{record.row_align}" class="{name}__row"
							flexGrow="{record.flex_grow}">
					<f:for each="{children600}" as="child">
						{child.renderedContent -> f:format.raw()}
					</f:for>
				</layout:row>
			</f:defaultCase>

		</f:switch>

	</layout:section>
