<fc:component>
	<fc:param name="name" type="string" optional="1" default="m-container"/>
	<fc:param name="record" type="mixed"/>
	<fc:param name="children600" type="array" optional="1"/>
	<fc:renderer>

		<layout:section
			class="{name}__wrap"
			record="{record}"
			id="c{record.uid}">
			<element:moduleHeader record="{record}"/>
			<element:richText text="{record.bodytext}" class="{name}__bodytext"/>

			<f:for each="{children600}" as="child">
				{child.renderedContent -> f:format.raw()}
			</f:for>

		</layout:section>

	</fc:renderer>
</fc:component>
