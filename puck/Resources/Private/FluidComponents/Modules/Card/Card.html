<fc:component>
	<fc:param name="name" type="string" optional="1" default="m-card"/>
	<fc:param name="record" type="mixed"/>
	<fc:renderer>

		<layout:card
			class="{name} l-row__item -bp-auto"
			media="{record.assets}"
			cropVariant="default"
			width="{record.container_width}"
			mediaSize="{record.card_media_size}"
			mediaWidth="{record.media_column_width}"
			mediaLayout="{record.media_layout}"
			attributes="{id:'c{record.uid}'}">
			<f:if condition="{record.icon}">
				<icon:svg icon="{record.icon}" class="{name}__icon"/>
			</f:if>
			<div class="{name}__card__text">
				<element:moduleHeader record="{record}" class="{name}__headline"/>
				<f:if condition="{record.bodytext}">
					<element:richText text="{record.bodytext}"/>
				</f:if>
			</div>
		</layout:card>

	</fc:renderer>
</fc:component>
