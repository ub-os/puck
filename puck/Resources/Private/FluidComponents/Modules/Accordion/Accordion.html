
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-accordion"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>
    <details class="{name}"
             data-connect="accordion"
             data-accordion.duration="220"
             data-accordion.group-id="c{object.txContainerParent}"
             id="c{object.uid}">
      <summary class="{name}__button"
               data-handler="accordion.toggle">
        <span class="{name}__title">{object.header -> f:format.raw()}</span>
        <span class="{name}__icon"></span>
      </summary>

        <div class="{name}__content">
          <layout:media
                  media="{object.assets}"
                  text="{object.bodytext}"
                  layout="{object.mediaLayout}"
                  justify="{object.rowJustify}"
                  align="{object.rowAlign}"
                  mediaWidth="{object.mediaColumnWidth}"
                  textWidth="{object.textColumnWidth}"
                  mediaMobileMaxVh="{object.mediaMaxHeight}"
                  itemWidth="{object.itemColumnWidth}"/>
        </div>
      </details>

  </fc:renderer>
</fc:component>
