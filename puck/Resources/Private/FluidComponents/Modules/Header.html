
<f:argument name="name" type="string" optional="1" default="m-header"/>
<f:argument name="record" type="mixed"/>
<f:argument name="context" type="array"/>


<header data-controller="page-header" class="{name}" id="header">
	<div class="{name}__background"></div>
	<div class="{name}__container">

		<f:link.typolink
			class="{name}__anchor"
			absolute="1"
			parameter="{context.site.rootPageId}"
			additionalAttributes="{aria-label:'Home'}">
			<f:image class="{name}__anchor__logo" src="EXT:puck/Resources/Public/Images/Logos/default.svg"/>
		</f:link.typolink>

		<div class="{name}__nav__wrap" id="main-nav">

			<element:navigation name="{name}__nav" identifier="main"/>
			<f:comment>
				// small navigation with search link that opens modal
				<element:navigation name="{name}__nav" class="-small" identifier="meta">
					<f:if condition="{record.uid} != {settings.system.searchPageUid}">
						<li class="{name}__nav__item">
							<button class="{name}__nav__link"
									data-action="modal.toggle#header-search-modal">
								{f:translate(extensionName:'puck',key:'search')}
							</button>
						</li>
					</f:if>
				</element:navigation>
			</f:comment>
		</div>

		<template data-append-on-load>
			<module:header.sidebarNav record="{record}"/>
			<module:header.burger/>
		</template>

	</div>
</header>

<f:comment>
	<module:header.searchModal/>
</f:comment>
