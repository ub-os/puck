
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-columns"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:section
        class="{name}__wrap"
        object="{object}"
        id="c{object.uid}">
      <element:text.header object="{object}"/>
      <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>

      <f:switch expression="{object.layout}">

        <f:case value="carousel">
          <layout:carousel id="c{object.uid}-splide" class="{name}__carousel">
            <f:for each="{object.inlineMedia}" as="item" iteration="i">
              <layout:row.item
                      class="splide__slide {name}__item"
                      width="{object.columnWidths.{i.index}}">
                <module:content.columns.item item="{item}"/>
              </layout:row.item>
            </f:for>
          </layout:carousel>
        </f:case>

        <f:defaultCase>
          <layout:row justify="{object.rowJustify}" align="{object.rowAlign}" class="{name}__row" flexGrow="{object.flexGrow}">
            <f:for each="{object.inlineMedia}" as="item" iteration="i">
              <layout:row.item width="{object.columnWidths.{i.index}} -responsive-order-{item.responsiveOrder}">
                <module:content.columns.item item="{item}"/>
              </layout:row.item>
            </f:for>
          </layout:row>
        </f:defaultCase>

      </f:switch>

    </layout:section>

  </fc:renderer>
</fc:component>
