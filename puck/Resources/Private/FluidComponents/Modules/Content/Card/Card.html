
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-card"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <div class="{name}" id="c{object.uid}">
      <layout:card
              media="{object.assets}"
              cropVariant="default"
              width="{object.containerWidth}"
              mediaSize="{object.cardMediaSize}"
              mediaWidth="{object.mediaColumnWidth}"
              mediaLayout="{object.mediaLayout}">
        <f:if condition="{object.icon}">
          <icon:svg icon="{object.icon}" class="{name}__icon"/>
        </f:if>
        <element:text.header object="{object}" class="{name}__headline"/>
        <f:if condition="{object.bodytext}">
          <element:text.rich text="{object.bodytext}"/>
        </f:if>
      </layout:card>
    </div>

  </fc:renderer>
</fc:component>
