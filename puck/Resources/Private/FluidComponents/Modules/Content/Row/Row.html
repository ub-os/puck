
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-row"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="children" type="array" optional="1"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap"
            object="{object}"
            id="c{object.uid}">
      <element:text.header object="{object}"/>
      <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>

      <f:switch expression="{object.layout}">

        <f:case value="carousel">
          <layout:carousel id="c{object.uid}-splide" class="{name}__carousel"
                           align="{object.rowAlign}"
                           arrows="{object.flexForms.options.carousel.arrows}"
                           pagination="{object.flexForms.options.carousel.pagination}"
                           trackOverflow="{object.flexForms.options.carousel.trackOverflow}"
                           options="{object.flexForms.options.splide}">
            <f:for each="{children}" as="child">
              <layout:row.item class="splide__slide {name}__item {f:if(condition:'{object.rowAlign} === \'stretch\'', then:'-stretch-content')}"
                               width="{child.container_width}">
                {child.renderedContent -> f:format.raw()}
              </layout:row.item>
            </f:for>
          </layout:carousel>
        </f:case>

        <f:defaultCase>
          <layout:row justify="{object.rowJustify}" align="{object.rowAlign}" class="{name}__row" flexGrow="{object.flexGrow}">
            <f:for each="{children}" as="child">
              <layout:row.item class="{name}__item {f:if(condition:'{object.rowAlign} === \'stretch\'', then:'-stretch-content')}"
                               width="{child.container_width}">
                {child.renderedContent -> f:format.raw()}
              </layout:row.item>
            </f:for>
          </layout:row>
        </f:defaultCase>

      </f:switch>

    </layout:section>

  </fc:renderer>
</fc:component>
