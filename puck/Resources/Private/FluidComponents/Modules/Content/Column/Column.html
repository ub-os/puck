
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-content-column"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <layout:row.item class="splide__slide {name}__item" width="{object.containerWidth}">
      <element:text.header object="{object}"/>
      <layout:media
              media="{object.assets}"
              text="{object.bodytext}"
              layout="{object.mediaLayout}"
              justify="{object.rowJustify}"
              align="{object.rowAlign}"
              mediaWidth="{object.mediaColumnWidth}"
              textWidth="{object.textColumnWidth}"
              itemWidth="{object.itemColumnWidth}"
              mediaMobileMaxVh="{object.mediaMaxHeight}"/>
    </layout:row.item>

  </fc:renderer>
</fc:component>
