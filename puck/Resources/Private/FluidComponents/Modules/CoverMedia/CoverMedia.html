
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-cover-media"/>
  <fc:param name="record" type="mixed"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap -layout-{record.media_layout}"
            object="{object}"
            container="{f:if(condition: '{record.media_layout_direction} == \'row\'', then:1, else:0)}"
            id="c{record.uid}">
      <f:if condition="{record.media_layout_direction} == 'column'">
        <f:then>
          <f:if condition="{record.bodytext} || {record.header} || {record.subheader}">
            <layout:container width="{record.container_width}" align="{record.container_position}" offset="{record.container_offset}">
              <div class="{name}__content -layout-{record.media_layout}">
                <element:moduleHeader object="{record}"/>
                <element:richText text="{record.bodytext}"/>
                {content -> f:format.raw()}
              </div>
            </layout:container>
          </f:if>
          <element:media
                  name="{name}"
                  class="-layout-{record.media_layout}"
                  file="{record.assets.0}"
                  width="2560"
                  sources="{
                      xs: {width: 450, cropVariant: 'default'},
                      l: {width: 1325, cropVariant: 'default'},
                      1920: {width: 1920, cropVariant: 'default'}
                  }"
                  breakpointSources="1"/>
        </f:then>
        <f:else>
          <layout:row justify="space-between" class="{name}__row -layout-{record.media_layout}">
            <layout:row.item width="6" attributes="{style:'position:relative'}">
              <element:media
                      name="{name}"
                      class="-layout-{record.media_layout}"
                      file="{record.assets.0}"
                      width="1280"
                      breakpointSources="1"
                      sources="{
                          xs: {width: 450, cropVariant: 'default'},
                          m: {width: 975, cropVariant: 'default'},
                          1920: {width: 975, cropVariant: 'default'}
                    }"/>
            </layout:row.item>
            <layout:row.item width="5">
              <div class="{name}__content -layout-{record.media_layout}">
                <element:moduleHeader object="{record}"/>
                <element:richText text="{record.bodytext}"/>
              </div>
            </layout:row.item>
          </layout:row>
        </f:else>
      </f:if>
    </layout:section>

  </fc:renderer>
</fc:component>
