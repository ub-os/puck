<fc:component>
    <fc:param name="name" optional="1" type="string" default="m-menu"/>
    <fc:param name="record" type="mixed"/>
    <fc:param name="menu" type="array" optional="1"/>
    <fc:param name="headerContent" type="Slot" default="" optional="1"/>
    <fc:param name="footerContent" type="Slot" default="" optional="1"/>
    <fc:param default="3:2" name="cropVariant" optional="1" type="string"/>

    <fc:renderer>

        <layout:section
                class="{name}__wrap"
                customContainer="{f:if(condition:'{record.layout} == \'cards\' || {record.layout} == \'columns\'',then:'',else:name)}"
                id="c{record.uid}"
                record="{record}">
            <element:moduleHeader record="{record}"/>
            <element:richText text="{record.bodytext}" class="{name}__bodytext"/>

            <div class="{name}__body" id="c{record.uid}-body">

                <fc:slot name="headerContent"/>

                <f:if condition="{menu}">
                    <u:var set="teaserScript">if (event.target.tagName !== 'A') { this.querySelector('a').click(); }</u:var>
                    <f:switch expression="{record.layout}">

                        <f:case value="default-cards">
                            <layout:row class="{name}__row"
                                        flexGrow="0" justify="left" align="top"
                                        >
                                <f:for as="item" each="{menu}" iteration="i">
                                    <layout:row.item class="{name}__item -stretch-content" width="6">
                                        <layout:card
                                                attributes="{onclick:teaserScript}"
                                                class="{name}__card -variant-{record.layout}"
                                                cropVariant="{cropVariant}"
                                                width="6">
                                            <module:menu.teaser
                                                    config="{teaserText:1}"
                                                    page="{item}"
                                                    name="{name}"/>
                                        </layout:card>
                                    </layout:row.item>
                                </f:for>
                            </layout:row>
                        </f:case>

                        <f:case value="blog-cards">
                            <layout:row class="{name}__row"
                                        flexGrow="0" justify="left" align="top"
                                        >
                                <f:for as="item" each="{menu}" iteration="i">
                                    <layout:row.item class="{name}__item -stretch-content" width="6">
                                        <layout:card
                                                attributes="{onclick:teaserScript}"
                                                class="{name}__card -variant-{record.layout}"
                                                cropVariant="{cropVariant}"
                                                width="6">
                                            <module:menu.teaser
                                                    config="{postDate:1, categories: 1}"
                                                    page="{item}"
                                                    name="{name}"/>
                                        </layout:card>
                                    </layout:row.item>
                                </f:for>
                            </layout:row>
                        </f:case>

                        <f:case value="team-cards">
                            <layout:row class="{name}__row"
                                        align="top" flexGrow="0" justify="left"

                                        >
                                <f:for as="item" each="{menu}" iteration="i">
                                    <layout:row.item class="{name}__item -stretch-content" width="6">
                                        <layout:card
                                                attributes="{onclick:teaserScript}"
                                                class="{name}__card -variant-{record.layout}">
                                            <f:alias map="{person: item.page_persons.0}">
                                                <div class="{name}__content">
                                                    <h3 class="{name}__headline">{person.name}</h3>
                                                    <ul>
                                                        <f:if condition="{person.position}">
                                                            <li class="{name}__position">{person.position}</li>
                                                        </f:if>
                                                        <f:if condition="{person.phone}">
                                                            <li><a class="{name}__phone"
                                                                    href="tel:{person.phone}">{person.phone}</a></li>
                                                        </f:if>
                                                        <f:if condition="{person.email}">
                                                            <li>
                                                                <f:link.email class="{name}__email" email="{person.email}">
                                                                    {person.email}
                                                                </f:link.email>
                                                            </li>
                                                        </f:if>
                                                    </ul>
                                                </div>
                                            </f:alias>
                                        </layout:card>
                                    </layout:row.item>
                                </f:for>
                            </layout:row>
                        </f:case>

                        <f:case value="columns">
                            <layout:row class="{name}__row"
                                        flexGrow="{record.flex_grow}" align="{record.row_align}" justify="{record.row_justify}"
                                        >
                                <f:for as="item" each="{menu}" iteration="i">
                                    <layout:row.item class="{name}__item -stretch-content"
                                                     width="{record.item_column_width}">
                                        <f:variable name="media"
                                                    value="{f:if(condition:record.menu_item_config.media,then:'{0:item.media.0}')}"/>
                                        <div class="{name}__column -variant-{record.layout}"
                                             onclick="{teaserScript}">
                                            <layout:media
                                                    cropVariant="{cropVariant}"
                                                    itemWidth="{record.media_column_width}"
                                                    layout="{record.media_layout}"
                                                    media="{media}"
                                                    showTitle="0"
                                                    showDesc="0"
                                                    mediaWidth="{record.media_column_width}"
                                                    textWidth="{record.text_column_width}">
                                                <module:menu.teaser
                                                        config="{record.menu_item_config}"
                                                        page="{item}"
                                                        name="{name}"/>
                                            </layout:media>
                                        </div>
                                    </layout:row.item>
                                </f:for>
                            </layout:row>
                        </f:case>

                        <f:defaultCase>
                            <layout:row class="{name}__row"
                                        flexGrow="{record.flex_grow}" align="{record.row_align}" justify="{record.row_justify}"
                                        >
                                <f:for as="item" each="{menu}" iteration="i">
                                    <layout:row.item class="{name}__item -stretch-content"
                                                     width="{record.item_column_width}">
                                        <f:variable name="media"
                                                    value="{f:if(condition:record.menu_item_config.media,then:item.media)}"/>
                                        <layout:card
                                                attributes="{onclick:teaserScript}"
                                                class="{name}__card -variant-{record.layout}"
                                                cropVariant="{cropVariant}"
                                                media="{media}"
                                                mediaLayout="{record.media_layout}"
                                                mediaSize="{record.card_media_size}"
                                                mediaWidth="{record.media_column_width}"
                                                width="{record.item_column_width}">
                                            <module:menu.teaser
                                                    config="{record.menu_item_config}"
                                                    page="{item}"
                                                    name="{name}"/>
                                        </layout:card>
                                    </layout:row.item>
                                </f:for>
                            </layout:row>
                        </f:defaultCase>
                    </f:switch>
                </f:if>

                <fc:slot name="footerContent"/>

            </div>

        </layout:section>

    </fc:renderer>
</fc:component>
