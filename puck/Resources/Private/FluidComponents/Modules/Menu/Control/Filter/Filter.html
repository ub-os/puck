
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-menu-control-filter"/>
  <fc:param name="categoryFilter" type="UBOS\Puck\Menu\Dto\CategoryFilter"/>
    <fc:param name="id" type="string" optional="1"/>
  <fc:renderer>

      <f:if condition="{categoryFilter.items}">
          <div class="{name}">
              <ul class="{name}__list">
                  <f:for each="{categoryFilter.items}" as="item" iteration="i">
                      <li class="{name}__item">
                      <f:if condition="{item.items}">
                          <f:then>
                              <f:variable name="buttonContent">
                                   
                                  <f:if condition="{item.closeItem}">
                                      <a href="{item.closeItem.url}"
                                         class="e-dropdown__close"
                                         data-toggle-stop
                                         data-fetch-link='{item.closeItem.fetchLinkOptions -> f:format.json()}'>
                                          {item.activeItemsUids -> f:count()}
                                          <icon:char icon="xmark-regular" class="e-dropdown__close__icon"/>
                                      </a> 
                                  </f:if>
                              </f:variable>
                              <element:dropdown
                                      id="{id}-{i.index}-dropdown"
                                      label="{item.label}"
                                      buttonContent="{buttonContent -> f:format.raw()}">
                                  <f:for each="{item.items}" as="item2">
                                      <f:variable name="mods" value="{-active:item2.active, disabled:item2.hasNoPotential}"/>
                                      <f:if condition="{item2.active}">
                                          <f:then>
                                              <a href="{item2.url}"
                                                 class="e-dropdown__option {mods -> puck:modClass()}"
                                                 data-fetch-link='{item2.fetchLinkOptions -> f:format.json()}'>
                                                  {item2.label} <icon:char icon="xmark-regular" class="e-button-dropdown__option__close__icon"/>
                                              </a>
                                          </f:then>
                                          <f:else>
                                              <a href="{item2.url}"
                                                 class="e-dropdown__option {mods -> puck:modClass()}"
                                                 data-fetch-link='{item2.fetchLinkOptions -> f:format.json()}'>
                                                  {item2.label}
                                              </a>
                                          </f:else>
                                      </f:if>
                                  </f:for>
                              </element:dropdown>
                          </f:then>

                          <f:else>
                              <f:variable name="mods" value="{-active:item.active, disabled:item.hasNoPotential, icon: item.active}"/>
                              <a href="{item.url}"
                                 class="{name}__link e-button-primary {mods -> puck:modClass()}"
                                 data-fetch-link='{item.fetchLinkOptions -> f:format.json()}'>
                                  {item.label}<f:if condition="{item.active}"> <icon:char icon="xmark-regular" /></f:if>
                              </a>
                          </f:else>

                      </f:if>
                      </li>
                  </f:for>
              </ul>
          </div>
      </f:if>

  </fc:renderer>
</fc:component>
