<fc:component>
    <fc:param default="m-menu-control-filter" name="name" optional="1" type="string"/>
    <fc:param name="categoryFilter" type="UBOS\Puck\Menu\Dto\CategoryFilter"/>
    <fc:param name="id" optional="1" type="string"/>
    <fc:renderer>

        <f:if condition="{categoryFilter.items}">
            <div class="{name}">
                <ul class="{name}__list">
                    <f:for as="item" each="{categoryFilter.items}" iteration="i">
                        <li class="{name}__item">
                            <f:if condition="{item.items}">
                                <f:then>
                                    <f:variable name="buttonContent">
                                         
                                        <f:if condition="{item.closeItem}">
                                            <pux-fetch-link
                                                    class="e-dropdown__close"
                                                    data-toggle-stop
                                                    replace-state="{item.closeItem.url}"
                                                    props='{item.closeItem.fetchLinkOptions -> f:format.json()}'>
                                                <a href="{item.closeItem.url}">
                                                    {item.activeItemsUids -> f:count()}
                                                    <icon:char class="e-dropdown__close__icon" icon="xmark-regular"/>
                                                </a>
                                            </pux-fetch-link>
                                             
                                        </f:if>
                                    </f:variable>
                                    <element:dropdown
                                            buttonContent="{buttonContent -> f:format.raw()}"
                                            id="{id}-{i.index}-dropdown"
                                            label="{item.label}">
                                        <f:for as="item2" each="{item.items}">
                                            <f:variable name="mods"
                                                        value="{-active:item2.active, disabled:item2.hasNoPotential}"/>
                                            <f:if condition="{item2.active}">
                                                <f:then>
                                                    <pux-fetch-link
                                                            class="e-dropdown__option {mods -> puck:modClass()}"
                                                            replace-state="{item2.url}"
                                                            props='{item2.fetchLinkOptions -> f:format.json()}'>
                                                        <a href="{item2.url}">
                                                            {item2.label} 
                                                            <icon:char class="e-button-dropdown__option__close__icon"
                                                                       icon="xmark-regular"/>
                                                        </a>
                                                    </pux-fetch-link>
                                                </f:then>
                                                <f:else>
                                                    <pux-fetch-link
                                                            class="e-dropdown__option {mods -> puck:modClass()}"
                                                            replace-state="{item2.url}"
                                                            props='{item2.fetchLinkOptions -> f:format.json()}'>
                                                        <a href="{item2.url}">
                                                            {item2.label}
                                                        </a>
                                                    </pux-fetch-link>
                                                </f:else>
                                            </f:if>
                                        </f:for>
                                    </element:dropdown>
                                </f:then>

                                <f:else>
                                    <f:variable name="mods"
                                                value="{-active:item.active, disabled:item.hasNoPotential, icon: item.active}"/>
                                    <pux-fetch-link
                                            class="{name}__link e-button-primary {mods -> puck:modClass()}"
                                            replace-state="{item.url}"
                                            props='{item.fetchLinkOptions -> f:format.json()}'>
                                        <a href="{item.url}">
                                            {item.label}
                                            <f:if condition="{item.active}"> 
                                                <icon:char icon="xmark-regular"/>
                                            </f:if>
                                        </a>
                                    </pux-fetch-link>
                                </f:else>

                            </f:if>
                        </li>
                    </f:for>
                </ul>
            </div>
        </f:if>

    </fc:renderer>
</fc:component>
