
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-menu-control-pagination"/>
  <fc:param name="item" type="UBOS\Puck\Menu\Dto\PaginationItem"/>
  <fc:param name="sectionId" type="string" optional="1"/>
  <fc:renderer>

    <li class="{name}__item">
      <f:if condition="{item.active}">
        <f:then>
          <div class="{name}__link -disabled">{item.label}</div>
        </f:then>
        <f:else>
          <f:switch expression="{item.label}">
            <f:case value="<">
              <f:variable name="label">
                <icon:svg icon="arrow-left-regular" class="{name}__prev"/>
              </f:variable>
              <f:variable name="ariaLabel" value="{f:translate(key:'previous')} {f:translate(key:'page')}" />
            </f:case>
            <f:case value=">">
              <f:variable name="label">
                <icon:svg icon="arrow-right-regular" class="{name}__next"/>
              </f:variable>
              <f:variable name="ariaLabel" value="{f:translate(key:'next')} {f:translate(key:'page')}" />
            </f:case>
            <f:defaultCase>
              <f:variable name="label" value="{item.label}"/>
              <f:variable name="ariaLabel" value="{f:translate(key:'page')} {item.label}" />
            </f:defaultCase>
          </f:switch>
          <a href="{item.url}#{sectionId}"
             class="{name}__link"
             data-fetch-href="{item.fetchLinkOptions.url}"
             data-turbo-action="advance"
            aria-label="{ariaLabel}">
            {label -> f:format.raw()}
          </a>
        </f:else>
      </f:if>
    </li>

  </fc:renderer>
</fc:component>
