
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-menu-control-pagination"/>
  <fc:param name="pagination" type="UBOS\Puck\Menu\Dto\Pagination"/>
  <fc:param name="sectionId" type="string" optional="1"/>
  <fc:renderer>

    <f:if condition="{pagination.loadMore}">
      <f:then>
        <module:menu.control.loadMoreButton loadMoreItem="{pagination.loadMore}" sectionId="{sectionId}"/>
      </f:then>
      <f:else if="{pagination.items}">
        <ul class="{name}"
            id="{sectionId}-pagination"
            data-hx-select="#{sectionId}-list"
            data-hx-target="#{sectionId}-list"
            data-hx-select-oob="#{sectionId}-filter,#{sectionId}-pagination">
          <f:if condition="{pagination.prev}">
            <module:menu.control.pagination.item item="{pagination.prev}"  sectionId="{sectionId}"/>
          </f:if>
          <f:if condition="{pagination.first}">
            <module:menu.control.pagination.item item="{pagination.first}"  sectionId="{sectionId}"/>
          </f:if>
          <f:if condition="{pagination.separatorLeft}">
             {pagination.separatorString} 
          </f:if>
          <f:for each="{pagination.items}" as="item" iteration="i">
            <module:menu.control.pagination.item item="{item}"  sectionId="{sectionId}"/>
          </f:for>
          <f:if condition="{pagination.separatorRight}">
             {pagination.separatorString} 
          </f:if>
          <f:if condition="{pagination.last}">
            <module:menu.control.pagination.item item="{pagination.last}"  sectionId="{sectionId}"/>
          </f:if>
          <f:if condition="{pagination.next}">
            <module:menu.control.pagination.item item="{pagination.next}"  sectionId="{sectionId}"/>
          </f:if>
        </ul>
      </f:else>
      <f:else>
        <div id="{sectionId}-pagination"></div>
      </f:else>
    </f:if>

  </fc:renderer>
</fc:component>
