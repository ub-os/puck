<fc:component>
    <fc:param name="name" type="string" optional="1" default="m-menu-control-load-more-button" />
    <fc:param name="loadMoreItem" type="UBOS\Puck\Menu\Dto\PaginationItem"/>

    <fc:renderer>

        <div class="{name}__wrap">
            <f:if condition="!{loadMoreItem.disabled}">
                <f:then>
                    <button class="{name}__button e-button-primary -ghost"
                            id="{loadMoreItem.fetchLinkOptions.contentId}-load-more-button"
                            data-fetch-link='{loadMoreItem.fetchLinkOptions -> f:format.json()}'>
                        <f:switch expression="{loadMoreItem.fetchLinkOptions.trigger}">
                            <f:case value="scrollIntoView">
                                <icon:svg icon="spinner-circle"/>
                            </f:case>
                            <f:defaultCase>
                                <icon:svg icon="plus-regular"/>
                            </f:defaultCase>
                        </f:switch>
                    </button>
                </f:then>
                <f:else>
                    <button class="e-button-primary -disabled"
                            id="{loadMoreItem.fetchLinkOptions.contentId}-load-more-button"
                            style="display: none"></button>
                </f:else>
            </f:if>
        </div>


    </fc:renderer>
</fc:component>
