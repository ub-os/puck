
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-menu__filter"/>
  <fc:param name="categoryFilter" type="UBOS\Puck\Menu\Dto\CategoryFilter"/>
    <fc:param name="sectionId" type="string" optional="1"/>
  <fc:renderer>

      <f:if condition="{categoryFilter.items}">
          <div class="{name}"
               id="{sectionId}-filter"
               data-hx-select="#{sectionId}-list"
               data-hx-target="#{sectionId}-list"
               data-hx-select-oob="#{sectionId}-filter,#{sectionId}-pagination"
          >
              <ul class="{name}__list">
                  <f:for each="{categoryFilter.items}" as="item" iteration="i">
                      <li class="{name}__item">
                      <f:if condition="{item.children}">
                          <f:then>
                              <f:variable name="buttonContent">
                                   
                                  <f:if condition="{item.closeItem}">
                                      <a href="{item.closeItem.url}"
                                         class="e-dropdown__close"
                                         data-hx-get="{item.closeItem.fetchLinkOptions.url}"
                                         data-hx-push-url="{item.closeItem.url}">
                                          {item.activeChildren -> f:count()}
                                          <icon:char icon="xmark-regular" class="e-dropdown__close__icon"/>
                                      </a> 
                                  </f:if>
                              </f:variable>
                              <element:dropdown
                                      id="{sectionId}-filter-{i.index}-dropdown"
                                      label="{item.label}"
                                      buttonContent="{buttonContent -> f:format.raw()}">
                                  <f:for each="{item.children}" as="childItem">
                                      <f:variable name="mods" value="{-active:childItemactive, disabled:childItem.hasNoPotential}"/>
                                          <a href="{childItem.url}"
                                             class="e-dropdown__option {mods -> puck:modClass()}"
                                             data-hx-get="{childItem.fetchLinkOptions.url}"
                                             data-hx-push-url="{childItem.url}">
                                              {childItem.label}
                                              <f:if condition="{childItem.active}">
                                                 <icon:char icon="xmark-regular" class="e-button-dropdown__option__close__icon"/>
                                              </f:if>
                                          </a>
                                  </f:for>
                              </element:dropdown>
                          </f:then>

                          <f:else>
                              <f:variable name="mods" value="{-active:item.active, disabled:item.hasNoPotential, icon: item.active}"/>
                              <a href="{item.url}"
                                 class="{name}__link e-button {mods -> puck:modClass()}"
                                 data-hx-get="{item.fetchLinkOptions.url}"
                                 data-hx-push-url="{item.url}">
                                  {item.label}<f:if condition="{item.active}"> <icon:char icon="xmark-regular" /></f:if>
                              </a>
                          </f:else>

                      </f:if>
                      </li>
                  </f:for>
              </ul>
          </div>
      </f:if>

  </fc:renderer>
</fc:component>
