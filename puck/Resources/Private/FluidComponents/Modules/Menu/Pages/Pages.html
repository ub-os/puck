<fc:component>
    <fc:param default="m-menu-pages" name="name" optional="1" type="string"/>
    <fc:param name="object" type="mixed"/>
    <fc:param name="headerContent" type="Slot" default="" optional="1"/>
    <fc:param name="footerContent" type="Slot" default="" optional="1"/>
    <fc:param default="3:2" name="cropVariant" optional="1" type="string"/>

    <fc:renderer>

        <layout:section
                class="{name}__wrap"
                customContainer="{f:if(condition:'{object.layout} == \'cards\' || {object.layout} == \'columns\'',then:'',else:name)}"
                id="c{object.uid}"
                object="{object}">
            <element:text.header object="{object}"/>
            <element:text.rich text="{object.bodytext}" class="{name}__bodytext"/>

            <turbo-frame class="{name}__body" id="c{object.uid}-body">

                <fc:slot name="headerContent"/>

                <f:if condition="{object.menu}">

                    <f:if condition="{item.uid} != {object.pid}">

                        <f:switch expression="{object.layout}">

                            <f:case value="default-cards">
                                <layout:row class="{name}__row"
                                            flexGrow="0" justify="left" align="top"
                                            attributes=""
                                            id="c{object.uid}-list">
                                    <f:for as="item" each="{object.menu}" iteration="i">
                                        <layout:row.item class="{name}__item -stretch-content" width="6">
                                            <layout:card
                                                    attributes="data-controller=link data-link-to={f:uri.page(pageUid: item.uid)} data-link-target={item.target}"
                                                    class="{name}__card -variant-{object.layout}"
                                                    cropVariant="{cropVariant}"
                                                    width="6">
                                                <module:menu.pages.content
                                                        config="{teaserText:1}"
                                                        item="{item}"
                                                        name="{name}"/>
                                            </layout:card>
                                        </layout:row.item>
                                    </f:for>
                                </layout:row>
                            </f:case>

                            <f:case value="blog-cards">
                                <layout:row class="{name}__row"
                                            flexGrow="0" justify="left" align="top"
                                            attributes="data-turbo-frame=_top"
                                            id="c{object.uid}-list">
                                    <f:for as="item" each="{object.menu}" iteration="i">
                                        <layout:row.item class="{name}__item -stretch-content" width="6">
                                            <layout:card
                                                    attributes="data-controller=link data-link-to={f:uri.page(pageUid: item.uid)} data-link-target={item.target}"
                                                    class="{name}__card -variant-{object.layout}"
                                                    cropVariant="{cropVariant}"
                                                    width="6">
                                                <module:menu.pages.content
                                                        config="{postDate:1, categories: 1}"
                                                        item="{item}"
                                                        name="{name}"/>
                                            </layout:card>
                                        </layout:row.item>
                                    </f:for>
                                </layout:row>
                            </f:case>

                            <f:case value="team-cards">
                                <layout:row class="{name}__row"
                                            align="top" flexGrow="0" justify="left"
                                            attributes="data-turbo-frame=_top"
                                            id="c{object.uid}-list">
                                    <f:for as="item" each="{object.menu}" iteration="i">
                                        <layout:row.item class="{name}__item -stretch-content" width="6">
                                            <layout:card
                                                    attributes="data-controller=link data-link-to={f:uri.page(pageUid: item.uid)} data-link-target={item.target}"
                                                    class="{name}__card -variant-{object.layout}">
                                                <f:alias map="{person: item.pagePersons.0}">
                                                    <div class="{name}__content">
                                                        <h3 class="{name}__headline">{person.name}</h3>
                                                        <ul>
                                                            <f:if condition="{person.position}">
                                                                <li class="{name}__position">{person.position}</li>
                                                            </f:if>
                                                            <f:if condition="{person.phone}">
                                                                <li><a class="{name}__phone"
                                                                        href="tel:{person.phone}">{person.phone}</a></li>
                                                            </f:if>
                                                            <f:if condition="{person.email}">
                                                                <li>
                                                                    <f:link.email class="{name}__email" email="{person.email}">
                                                                        {person.email}
                                                                    </f:link.email>
                                                                </li>
                                                            </f:if>
                                                        </ul>
                                                    </div>
                                                </f:alias>
                                            </layout:card>
                                        </layout:row.item>
                                    </f:for>
                                </layout:row>
                            </f:case>

                            <f:case value="columns">
                                <layout:row class="{name}__row"
                                            flexGrow="{object.flexGrow}" align="{object.rowAlign}" justify="{object.rowJustify}"
                                            attributes="data-turbo-frame=_top"
                                            id="c{object.uid}-list">
                                    <f:for as="item" each="{object.menu}" iteration="i">
                                        <layout:row.item class="{name}__item -stretch-content"
                                                         width="{object.itemColumnWidth}">
                                            <f:variable name="media"
                                                        value="{f:if(condition:object.menuItemConfig.media,then:'{0:item.media.0}')}"/>
                                            <div class="{name}__column -variant-{object.layout}"
                                                 data-link-to="{f:uri.page(pageUid: item.uid)}"
                                                target="{item.target}">
                                                <layout:media
                                                        cropVariant="{cropVariant}"
                                                        itemWidth="{object.mediaColumnWidth}"
                                                        layout="{object.mediaLayout}"
                                                        media="{media}"
                                                        showTitle="0"
                                                        showDesc="0"
                                                        mediaWidth="{object.mediaColumnWidth}"
                                                        textWidth="{object.textColumnWidth}">
                                                    <module:menu.pages.content
                                                            config="{object.menuItemConfig}"
                                                            item="{item}"
                                                            name="{name}"/>
                                                </layout:media>
                                            </div>
                                        </layout:row.item>
                                    </f:for>
                                </layout:row>
                            </f:case>

                            <f:defaultCase>
                                <layout:row class="{name}__row"
                                            flexGrow="{object.flexGrow}" align="{object.rowAlign}" justify="{object.rowJustify}"
                                            attributes="data-turbo-frame=_top"
                                            id="c{object.uid}-list">
                                    <f:for as="item" each="{object.menu}" iteration="i">
                                        <layout:row.item class="{name}__item -stretch-content"
                                                         width="{object.itemColumnWidth}">
                                            <f:variable name="media"
                                                        value="{f:if(condition:object.menuItemConfig.media,then:item.media)}"/>
                                            <layout:card
                                                    attributes="data-controller=link data-link-to={f:uri.page(pageUid: item.uid)} data-link-target={item.target}"
                                                    class="{name}__card -variant-{object.layout}"
                                                    cropVariant="{cropVariant}"
                                                    media="{media}"
                                                    mediaLayout="{object.mediaLayout}"
                                                    mediaSize="{object.cardMediaSize}"
                                                    mediaWidth="{object.mediaColumnWidth}"
                                                    width="{object.itemColumnWidth}">
                                                <module:menu.pages.content
                                                        config="{object.menuItemConfig}"
                                                        item="{item}"
                                                        name="{name}"/>
                                            </layout:card>
                                        </layout:row.item>
                                    </f:for>
                                </layout:row>
                            </f:defaultCase>

                        </f:switch>
                    </f:if>
                </f:if>

                <fc:slot name="footerContent"/>

            </turbo-frame>

        </layout:section>

    </fc:renderer>
</fc:component>
