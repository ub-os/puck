
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-menu-columns"/>
  <fc:param name="item" type="mixed" optional="1"/>
  <fc:param name="config" type="array" optional="1" default="{}"/>
  <fc:param name="attributes" type="array" optional="1"/>

  <fc:renderer>

      <div class="{name}__content">
        <f:if condition="{item.categories} && {config.categories}">
          <div class="{name}__categories">
            <f:for each="{item.categories}" as="cat" iteration="i">
              <span class="{name}__category">{cat.title}</span>
              <f:if condition="!{i.isLast}">
                <span class="{name}__categories__divider">|</span>
              </f:if>
            </f:for>
          </div>
        </f:if>
        <f:if condition="{item.postDate} && {config.postDate}">
          <time class="{name}__date" datetime="{item.postDate -> f:format.date(format: 'Y-m-d H:i:s')}">{item.postDate -> f:format.date(format: 'd.m.Y')}</time>
        </f:if>
        <f:if condition="{item.lastUpdated} && {config.lastUpdated}">
          <time class="{name}__date" datetime="{item.lastUpdated -> f:format.date(format: 'Y-m-d H:i:s')}">{item.lastUpdated -> f:format.date(format: 'd.m.Y')}</time>
        </f:if>
        <f:if condition="{item.icon} && {config.icon}">
          <icon:svg icon="{item.icon}" class="{name}__icon"/>
        </f:if>
        <a href="{f:uri.page(pageUid: item.uid)}"
           class="{name}__headline"
           target="{item.target}"
           onclick="event.preventDefault()"
           hx-boost="false"
           data-link-to-stop="1">
          <f:format.raw>{item.navTitle}</f:format.raw>
        </a>
        <f:if condition="{item.subtitle} && {config.subtitle}">
          <div class="{name}__subtitle">
            {item.subtitle}
          </div>
        </f:if>
        <f:if condition="{config.teaserText} && {item.teaserText}">
          <div class="{name}__teaser-text"><f:format.raw>{item.teaserText -> f:format.crop(maxCharacters:300)}</f:format.raw></div>
        </f:if>
        <f:if condition="{item.author} && {config.author}">
          <div class="{name}__author">
            {item.author}
          </div>
        </f:if>
        <f:if condition="{config.cta}">
          <button class="{name}__cta e-button-icon" tabindex="-1">
            <f:translate extensionName="puck" key="learn-more"/>
          </button>
        </f:if>
      </div>


  </fc:renderer>
</fc:component>
