<fc:component>
    <fc:param default="e-plugin-load-more-button" name="name" optional="1" type="string"/>
    <fc:param name="pagination" type="array"/>
    <fc:param name="loadMoreLink" type="array"/>
    <fc:renderer>

        <div class="{name}__wrap">
            <f:if condition="{pagination.next}">
                <f:then>
                    <button class="{name}__button e-button-primary -ghost"
                            id="{loadMoreLink.fetchLinkOptions.contentId}-load-more-button"
                            data-fetch-link='{loadMoreLink.fetchLinkOptions -> f:format.json()}'>
                        <f:switch expression="{loadMoreLink.fetchLinkOptions.trigger}">
                            <f:case value="scrollIntoView">
                                <icon:svg icon="spinner-circle"/>
                            </f:case>
                            <f:defaultCase>
                                <icon:svg icon="plus-regular"/>
                            </f:defaultCase>
                        </f:switch>
                    </button>
                </f:then>
                <f:else>
                    <button class="e-button-primary -disabled"
                            id="{loadMoreLink.fetchLinkOptions.contentId}-load-more-button"
                            style="display: none"></button>
                </f:else>
            </f:if>
        </div>


    </fc:renderer>
</fc:component>
