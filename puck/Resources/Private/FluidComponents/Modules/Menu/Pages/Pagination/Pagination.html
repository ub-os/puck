
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-plugin-pagination"/>
  <fc:param name="pagination" type="array"/>
  <fc:param name="paginationLinks" type="array"/>
  <fc:renderer>

    <f:if condition="{pagination.first} != {pagination.last}">
      <ul class="{name}">
        <f:if condition="{paginationLinks.prev}">
          <module:menu.pages.pagination.item link="{paginationLinks.prev}"/>
        </f:if>
        <module:menu.pages.pagination.item link="{paginationLinks.first}"/>
        <f:if condition="{pagination.slideLeft}">
          ...
        </f:if>
        <f:for each="{paginationLinks.window}" as="link" iteration="i">
          <module:menu.pages.pagination.item link="{link}"/>
        </f:for>
        <f:if condition="{pagination.slideRight}">
          ...
        </f:if>
        <module:menu.pages.pagination.item link="{paginationLinks.last}"/>
        <f:if condition="{pagination.next}">
          <module:menu.pages.pagination.item link="{paginationLinks.next}"/>
        </f:if>
      </ul>
    </f:if>

  </fc:renderer>
</fc:component>
