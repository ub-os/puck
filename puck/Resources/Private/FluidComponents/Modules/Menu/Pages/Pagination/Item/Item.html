
<fc:component>
  <fc:param name="name" type="string" optional="1" default="e-plugin-pagination"/>
  <fc:param name="link" type="array"/>
  <fc:renderer>

    <li class="{name}__item">
      <f:if condition="{link.active}">
        <f:then>
          <button class="{name}__link -disabled">{link.title}</button>
        </f:then>
        <f:else>
          <a href="{link.url}"
             data-fetch-link='{link.fetchLinkOptions -> f:format.json()}'
             class="{name}__link">
            <f:switch expression="{link.title}">
              <f:case value="<">
                <icon:svg icon="angle-left-regular" class="{name}__prev"/>
              </f:case>
              <f:case value=">">
                <icon:svg icon="angle-right-regular" class="{name}__next"/>
              </f:case>
              <f:defaultCase>{link.title}</f:defaultCase>
            </f:switch>
          </a>
        </f:else>
      </f:if>
    </li>

  </fc:renderer>
</fc:component>
