
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-footer"/>
  <fc:param name="record" type="mixed"/>
  <fc:renderer>

    <footer id="footer" class="{name}">
      <layout:section class="{name}__nav__wrap" id="footer-1">
        <f:comment>
        <element:navigation name="{name}__nav" pages="{settings.navUid.footer}" class="">
          <f:comment>
            <li class="{name}__nav__item">
              <button class="{name}__nav__link" onclick="UC_UI.showSecondLayer();">Cookie-Einstellungen</button>
            </li>
          </f:comment>
        </element:navigation>
        <element:navigation name="{name}__nav" pages="{settings.navUid.social}" class="-social" prependIcon="1" hideTitle="1"/>
        </f:comment>
      </layout:section>
      <fc:slot name="content"/>
    </footer>

  </fc:renderer>
</fc:component>
