
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-header"/>
  <fc:param name="object" type="mixed"/>
  <fc:param name="context" type="array"/>
  <fc:renderer>

    <header class="{name}" id="header"
            data-core="page-header">
      <div class="{name}__background"></div>
      <div class="{name}__container">

        <f:link.typolink
                class="{name}__anchor"
                absolute="1"
                parameter="{context.site.rootPageId}"
                additionalAttributes="{aria-label: 'home'}">
          <icon:svg class="{name}__logo" icon="website-logo"/>
        </f:link.typolink>

        <div class="{name}__nav__wrap"
             data-core="switchable-nav"
             data-switchable-nav:breakpoint="1150"
             id="main-nav">
          <element:navigation name="{name}__nav"
                              pages="{settings.navUid.main}"
                              label="{f:translate(key:'navigation.main')}"/>

          <template data-unit="switchable-nav.template" id="mobile-nav-template">
            <module:header.sidebarNav object="{object}"/>
            <module:header.burger />
          </template>

          <f:comment>
            // small navigation with search link that opens modal
            <element:navigation name="{name}__nav" class="-small" pages="{settings.navUid.meta}">
              <f:if condition="{object.uid} != {settings.search.pid}">
                <li class="{name}__nav__item">
                  <button class="{name}__nav__link"
                          data-trigger="modal::toggle#header-search-modal">
                    {f:translate(extensionName:'puck',key:'search')}
                  </button>
                </li>
              </f:if>
            </element:navigation>
          </f:comment>
        </div>

      </div>
    </header>

    <f:comment>
      <module:header.searchModal/>
    </f:comment>

  </fc:renderer>
</fc:component>
