
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-header"/>
  <fc:param name="record" type="mixed"/>
  <fc:param name="context" type="array"/>
  <fc:renderer>

    <header data-connect="page-header" class="{name}" id="header">
      <div class="{name}__background"></div>
      <div class="{name}__container">

        <f:link.typolink
                class="{name}__anchor"
                absolute="1"
                parameter="{context.site.rootPageId}"
                additionalAttributes="{aria-label: 'home'}">
          <icon:svg class="{name}__logo" icon="chestnut-solid"/>
        </f:link.typolink>

        <div class="{name}__nav__wrap" id="main-nav">

            <element:navigation name="{name}__nav"
                                pages="{settings.navigation.main}"
                                label="{f:translate(key:'navigation.main')}"/>
          <f:comment>
            // small navigation with search link that opens modal
            <element:navigation name="{name}__nav" class="-small" pages="{settings.navigation.meta}">
              <f:if condition="{record.uid} != {settings.search.pid}">
                <li class="{name}__nav__item">
                  <button class="{name}__nav__link"
                          data-handler="modal.toggle#header-search-modal">
                    {f:translate(extensionName:'puck',key:'search')}
                  </button>
                </li>
              </f:if>
            </element:navigation>
          </f:comment>
        </div>

        <template data-append-on-load>
          <module:header.sidebarNav record="{record}"/>
          <module:header.burger />
        </template>

      </div>
    </header>

    <f:comment>
      <module:header.searchModal/>
    </f:comment>

  </fc:renderer>
</fc:component>
