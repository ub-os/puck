
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-row"/>
  <fc:param name="record" type="mixed"/>
  <fc:param name="children" type="array" optional="1"/>
  <fc:renderer>

    <layout:section
            class="{name}__wrap"
            object="{record}"
            id="c{record.uid}">
      <element:moduleHeader object="{record}"/>
      <element:richText text="{record.bodytext}" class="{name}__bodytext"/>

      <f:switch expression="{record.layout}">
        <f:case value="carousel">
          <layout:carousel id="c{record.uid}-splide" class="{name}__carousel"
                           align="{record.row_align}"
                           arrows="{record.flexForms.options.carousel.arrows}"
                           pagination="{record.flexForms.options.carousel.pagination}"
                           trackOverflow="{record.flexForms.options.carousel.trackOverflow}"
                           carouselAttributes="{splideOptions: record.flexForms.options.splide}">
            <f:for each="{children}" as="child">
              <layout:row.item class="splide__slide {name}__item {f:if(condition:'{record.rowAlign} === \'stretch\'', then:'-stretch-content')}"
                               width="{child.container_width}">
                {child.renderedContent -> f:format.raw()}
              </layout:row.item>
            </f:for>
          </layout:carousel>
        </f:case>

        <f:defaultCase>
          <layout:row justify="{record.rowJustify}" align="{record.rowAlign}" class="{name}__row" flexGrow="{record.flexGrow}">
            <f:for each="{children}" as="child">
              <layout:row.item class="{name}__item {f:if(condition:'{record.rowAlign} === \'stretch\'', then:'-stretch-content')}"
                               width="{child.container_width}">
                {child.renderedContent -> f:format.raw()}
              </layout:row.item>
            </f:for>
          </layout:row>
        </f:defaultCase>

      </f:switch>


    </layout:section>

  </fc:renderer>
</fc:component>
