
	<f:argument name="name" type="string" optional="1" default="m-menu__pagination"/>
	<f:argument name="pagination" type="UBOS\MenuControls\Dto\Pagination"/>
	<f:argument name="sectionId" type="string" optional="1"/>


		<f:if condition="{pagination.loadMore}">
			<f:then>
				<module:pageMenu.loadMoreButton pagination="{pagination}" sectionId="{sectionId}"/>
			</f:then>
			<f:else if="{pagination.window}">
				<ul class="{name}"
					id="{sectionId}-pagination"
					data-hx-swap="outerHTML"
					data-hx-focus-after-swap="#{sectionId}-list a"
					data-hx-select="#{sectionId}-body"
					data-hx-target="#{sectionId}-body">
					<f:if condition="{pagination.prev}">
						<module:pageMenu.pagination.item item="{pagination.prev}" sectionId="{sectionId}"/>
					</f:if>
					<f:if condition="{pagination.first}">
						<module:pageMenu.pagination.item item="{pagination.first}" sectionId="{sectionId}"/>
					</f:if>
					<f:if condition="{pagination.separatorLeft}">
						 {pagination.separatorString} 
					</f:if>
					<f:for each="{pagination.window}" as="item" iteration="i">
						<module:pageMenu.pagination.item item="{item}" sectionId="{sectionId}"/>
					</f:for>
					<f:if condition="{pagination.separatorRight}">
						 {pagination.separatorString} 
					</f:if>
					<f:if condition="{pagination.last}">
						<module:pageMenu.pagination.item item="{pagination.last}" sectionId="{sectionId}"/>
					</f:if>
					<f:if condition="{pagination.next}">
						<module:pageMenu.pagination.item item="{pagination.next}" sectionId="{sectionId}"/>
					</f:if>
				</ul>
			</f:else>
			<f:else>
				<div id="{sectionId}-pagination"></div>
			</f:else>
		</f:if>
