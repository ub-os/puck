
	<f:argument name="name" type="string" optional="1" default="m-text"/>
	<f:argument name="record" type="mixed"/>

	<f:if condition="{record.colPos} < 600">
		<f:then>
			<layout:section
				class="{name}__wrap {f:if(condition: '!{record.bodytext}', then: '-headline-only')} {class}"
				record="{record}"
				id="c{record.uid}">
				<f:render section="InnerContent" arguments="{_all}"/>
			</layout:section>
		</f:then>
		<f:else>
			<layout:row.item
				class="{name}__row__item"
				width="{record.container_width}"
				attributes="{id:'c{record.uid}'}">
				<f:render section="InnerContent" arguments="{_all}"/>
			</layout:row.item>
		</f:else>
	</f:if>

	<f:section name="InnerContent">
		<element:moduleHeader record="{record}"/>
		<element:richText text="{record.bodytext}"/>
		<f:slot/>
	</f:section>
