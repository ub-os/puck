
	<f:argument name="name" type="string" optional="1" default="m-text"/>
	<f:argument name="record" type="mixed"/>


		<layout:section
			class="{name}__wrap {f:if(condition: '!{record.bodytext}', then: '-headline-only')} {class}"
			record="{record}"
			id="c{record.uid}">
			<element:moduleHeader record="{record}"/>
			<element:richText text="{record.bodytext}"/>
			<f:slot/>
		</layout:section>
