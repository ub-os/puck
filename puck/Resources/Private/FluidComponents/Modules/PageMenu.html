
<f:argument name="name" optional="1" type="string" default="m-menu"/>
<f:argument name="record" type="mixed"/>
<f:argument name="menu" type="array" optional="1"/>
<f:argument name="pagination" type="UBOS\MenuControls\Dto\Pagination" optional="1"/>
<f:argument name="categoryFilter" type="UBOS\MenuControls\Dto\CategoryFilter" optional="1"/>


<layout:section
	class="{name}__wrap"
	customContainer="{f:if(condition:'{record.layout} == \'cards\' || {record.layout} == \'columns\'',then:'',else:name)}"
	id="c{record.uid}"
	record="{record}">
	<element:moduleHeader record="{record}"/>
	<element:richText text="{record.bodytext}" class="{name}__bodytext"/>

	<div class="{name}__body" id="c{record.uid}-body" data-focus-after-swap="#c{record.uid}-list a">

		<f:if condition="{categoryFilter}">
			<module:pageMenu.filter categoryFilter="{categoryFilter}" contentUid="{record.uid}"/>
		</f:if>

		<f:comment>adjust teaser heading tags based on section heading tag to preserve hierarchy</f:comment>
		<f:variable name="subheadingMap" value="{0:'h2', p:'h2', h2:'h3', h3:'h4', h4:'h5'}"/>
		<u:var set="teaserHeadingTag" if="{record.header}" then="{subheadingMap.{record.header_layout.tag}}" else="h2"/>

		<f:if condition="{menu}">
			<f:switch expression="{record.layout}">

				<f:case value="default-cards">
					<layout:row class="{name}__row"
								id="c{record.uid}-list"
								flexGrow="0" justify="left" align="top">
						<f:for as="item" each="{menu}" iteration="i">
							<layout:card
								attributes="{data-link-area:''}"
								class="{name}__card l-row__item -bp-auto -variant-{record.layout}"
								cropVariant="16:9"
								width="4">
								<module:pageMenu.teaser
									config="{teaserText:1}"
									page="{item}"
									headingTag="{teaserHeadingTag}"
									name="{name}"/>
							</layout:card>
						</f:for>
					</layout:row>
				</f:case>

				<f:case value="blog-cards">
					<layout:row class="{name}__row"
								id="c{record.uid}-list"
								flexGrow="0" justify="left" align="top">
						<f:for as="item" each="{menu}" iteration="i">
							<layout:card
								attributes="{data-link-area:''}"
								class="{name}__card l-row__item -bp-auto -variant-{record.layout}"
								cropVariant="16:9"
								width="4">
								<module:pageMenu.teaser
									config="{postDate:1, categories: 1}"
									page="{item}"
									headingTag="{teaserHeadingTag}"
									name="{name}"/>
							</layout:card>
						</f:for>
					</layout:row>
				</f:case>

				<f:case value="columns">
					<layout:row class="{name}__row"
								id="c{record.uid}-list"
								flexGrow="{record.flex_grow}" align="{record.row_align}"
								justify="{record.row_justify}">
						<f:for as="item" each="{menu}" iteration="i">
							<f:variable name="media"
										value="{f:if(condition:record.menu_item_config.media,then:'{0:item.media.0}')}"/>
							<div
								class="{name}__column l-row__item -bp-auto -width-{record.item_column_width} -variant-{record.layout}"
								data-link-area>
								<layout:media
									cropVariant="16:9"
									itemWidth="{record.media_column_width}"
									layout="{record.media_layout}"
									media="{media}"
									showTitle="0"
									showDesc="0"
									mediaWidth="{record.media_column_width}"
									textWidth="{record.text_column_width}">
									<module:pageMenu.teaser
										config="{record.menu_item_config}"
										page="{item}"
										headingTag="{teaserHeadingTag}"
										name="{name}"/>
								</layout:media>
							</div>
						</f:for>
					</layout:row>
				</f:case>

				<f:defaultCase>
					<layout:row class="{name}__row"
								id="c{record.uid}-list"
								flexGrow="{record.flex_grow}" align="{record.row_align}"
								justify="{record.row_justify}">

						<f:for as="item" each="{menu}" iteration="i">
							<f:variable name="media"
										value="{f:if(condition:record.menu_item_config.media,then:item.media)}"/>
							<layout:card
								attributes="{data-link-area:''}"
								class="{name}__card l-row__item -bp-auto -variant-{record.layout}"
								cropVariant="16:9"
								media="{media}"
								mediaLayout="{record.media_layout}"
								mediaSize="{record.card_media_size}"
								mediaWidth="{record.media_column_width}"
								width="{record.item_column_width}">
								<module:pageMenu.teaser
									config="{record.menu_item_config}"
									page="{item}"
									headingTag="{teaserHeadingTag}"
									name="{name}"/>
							</layout:card>
						</f:for>
					</layout:row>
				</f:defaultCase>
			</f:switch>
		</f:if>

		<f:if condition="{pagination}">
			<module:pageMenu.pagination pagination="{pagination}" sectionId="c{record.uid}"/>
		</f:if>

	</div>

</layout:section>
