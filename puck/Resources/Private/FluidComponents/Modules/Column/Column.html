
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-column"/>
  <fc:param name="object" type="mixed"/>
  <fc:renderer>

    <div class="{name}" id="c{object.uid}">
      <element:moduleHeader object="{object}"/>
      <layout:media
              media="{object.assets}"
              text="{object.bodytext}"
              layout="{object.mediaLayout}"
              justify="{object.rowJustify}"
              align="{object.rowAlign}"
              mediaWidth="{object.mediaColumnWidth}"
              textWidth="{object.textColumnWidth}"
              itemWidth="{object.itemColumnWidth}"
              mediaMobileMaxVh="{object.mediaMaxHeight}"/>
    </div>

  </fc:renderer>
</fc:component>
