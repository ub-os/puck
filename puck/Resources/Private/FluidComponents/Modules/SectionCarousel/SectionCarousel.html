
<fc:component>
  <fc:param name="name" type="string" optional="1" default="m-section-carousel"/>
  <fc:param name="record" type="mixed"/>
  <fc:param name="children" type="array" optional="1"/>
  <fc:param name="options" type="array" optional="1"/>
  <fc:renderer>

    <layout:carousel id="c{record.uid}"
                     class="{name}"
                     arrows="{options.carousel.arrows}"
                     pagination="{options.carousel.pagination}"
                     trackOverflow="{options.carousel.trackOverflow}"
                     carouselAttributes="{splideOptions: options.splide}">
      <f:for each="{children}" as="child">
        <div class="{name}__slide splide__slide">
          {child.renderedContent -> f:format.raw()}
        </div>
      </f:for>
    </layout:carousel>

  </fc:renderer>
</fc:component>
