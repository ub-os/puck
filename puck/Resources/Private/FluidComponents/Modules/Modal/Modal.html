<fc:component>
	<fc:param name="name" type="string" optional="1" default="m-modal"/>
	<fc:param name="record" type="UBOS\Puck\Domain\ContentRecord"/>
	<fc:param name="cropVariant" type="string" optional="1" default="default"/>
	<fc:renderer>

		<layout:modal id="c{record.uid}" width="{record.container_width}">
			<layout:card
				media="{record.assets}"
				cropVariant="{cropVariant}"
				mediaSize="{record.card_media_size}"
				mediaWidth="{record.media_column_width}"
				mediaLayout="{record.media_layout}">
				<element:moduleHeader record="{record}"/>
				<element:richText text="{record.bodytext}"/>
				<f:format.html>{content}</f:format.html>
			</layout:card>
		</layout:modal>

	</fc:renderer>
</fc:component>
