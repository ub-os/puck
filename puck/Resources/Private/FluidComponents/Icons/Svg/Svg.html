<fc:component>
	<fc:param name="icon" type="string"/>
	<fc:param name="img" type="boolean" optional="1" default="0"/>
	<fc:param name="attributes" type="array" optional="1"/>
	<fc:param name="spriteSheet" type="string" optional="1"
			  default="{f:uri.resource(path:'Icons/sprite-sheet.svg', extensionName: 'puck')}"/>
	<fc:param name="titlePrefix" type="string" optional="1" default=""/>
	<fc:renderer>

		<svg class="{class} svg-icon svg--{icon}" {f:if(condition: img, then:
		'role="img"' else: 'aria-hidden="true"')} {attributes -> u:renderAttributes()}>
		<f:if condition="{img}">
			<title>{titlePrefix}{icon}</title>
		</f:if>
		<use tabindex="-1" href="{spriteSheet}#{icon}"></use>
		</svg>

	</fc:renderer>
</fc:component>
