base: /
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=7'
languages:
  -
    title: de
    enabled: true
    languageId: 0
    base: /
    typo3Language: de
    locale: de_DE.UTF-8
    iso-639-1: de
    navigationTitle: de
    hreflang: de-DE
    direction: ltr
    flag: de
    websiteTitle: 'Puck DE'
  -
    title: en
    enabled: true
    base: /en/
    typo3Language: default
    locale: en_US.UTF-8
    iso-639-1: en
    websiteTitle: ''
    navigationTitle: en
    hreflang: en-US
    direction: ''
    fallbackType: free
    fallbacks: ''
    flag: en-us-gb
    languageId: 1
    xml_sitemap_path: /en/sitemap-index.xml
rootPageId: 2
routes:
  -
    route: robots.txt
    type: staticText
    content: "# We do not distinguish between the browsers.\r\nUser-agent: *\r\n\r\n# Only allow URLs generated with frontend routing\r\nDisallow: /*?id=*\r\nDisallow: /*&id=*\r\n\r\n# L=0 is the default language\r\nDisallow: /*?L=0*\r\nDisallow: /*&L=0*\r\n\r\n# Should always be protected, but you know...\r\nDisallow: /*/Private/*\r\nDisallow: /*/Configuration/*\r\n\r\n# Disallow all files in /typo3temp/var/\r\nDisallow: /typo3temp/var/*\r\n\r\n# Disallow all files in /typo3/\r\nDisallow: /typo3/\r\n\r\n# Disallow all kind of sql files\r\nDisallow: *.sql\r\nDisallow: *.sql.gz\r\n\r\n# Sitemap files\r\nSitemap: https://puckv12.ubos-mittwald.de/sitemap-index.xml\r\nSitemap: https://puckv12.ubos-mittwald.de/sitemap.xml\r\nSitemap: https://puckv12.ubos-mittwald.de/sitemap-news.xml"
  -
    route: favicon.ico
    type: uri
    source: 't3://file?uid=130'
websiteTitle: Puck
xml_sitemap_path: sitemap-index.xml
routeEnhancerPages:
  sitemap: [ 2 ]
  indexedSearch: [ ]
  pageMenu: [ 4 ]
imports:
  -
    resource: 'EXT:puck/Configuration/Routes/IndexedSearch.yaml'
  -
    resource: 'EXT:puck/Configuration/Routes/PageMenu.yaml'
  -
    resource: 'EXT:puck/Configuration/Routes/Sitemap.yaml'
  -
    resource: 'EXT:puck/Configuration/Routes/TrailingSlash.yaml'
